<!-- Speech-bubble chat panel (only while awake) -->
<section id="panel" aria-label="Chat">
  <header>
    <div class="who">
      <span id="stage-face" aria-hidden="true"></span>
      <span id="name">Robo</span>
      <button id="folder" class="chip" title="Open folder"></button>
    </div>
    <div class="actions">
      <button id="btn-shell" title="Shell (Ctrl+`)" data-icon="shell"></button>
      <button id="btn-remote" title="Remote control" data-icon="phone"></button>
      <button id="btn-terminal" title="Open in terminal" data-icon="terminal"></button>
      <button id="btn-history" title="Past chats" data-icon="history"></button>
      <button id="btn-bonk" title="Bonk!" data-icon="hammer"></button>
      <button id="btn-reset" title="Start over" data-icon="reset"></button>
      <button id="btn-spot" title="Spotlight" data-icon="expand"></button>
      <button id="btn-unstage" title="Back to desk" data-icon="open"></button>
      <button id="btn-collapse" title="Tuck chat away" data-icon="collapse"></button>
      <button id="btn-island" title="Send to island" data-icon="island"></button>
    </div>
  </header>
  <div id="tabs" role="tablist" aria-label="Conversations"></div>
  <div id="logs"></div>
  <div id="todo" hidden></div>
  <div id="helpers" hidden></div>
  <!-- the files this conversation made or changed (chat/outputs.ts) -->
  <div id="outputs" hidden></div>
  <!-- one helper agent up close: its job, its steps as they happen, its report -->
  <div id="helper-view" hidden>
    <div class="h-top">
      <button id="hv-back" type="button" title="Back to chat (Esc)" data-icon="back"></button>
      <div id="hv-title"></div>
    </div>
    <div id="hv-body"></div>
  </div>
  <div id="status" hidden><span class="dots"><i></i><i></i><i></i></span><span id="status-text"></span><span id="status-meta"></span></div>
  <div id="history" hidden>
    <div class="h-top">
      <button id="h-back" type="button" title="All conversations" data-icon="back" hidden></button>
      <input id="h-search" type="search" placeholder="Search past conversations…" autocomplete="off" />
      <button id="h-close" type="button" title="Back to chat (Esc)" data-icon="x"></button>
    </div>
    <div id="h-list" role="list"></div>
    <div id="h-preview" hidden>
      <div id="h-ptitle"></div>
      <div id="h-msgs"></div>
      <button id="h-resume" type="button">Resume this conversation</button>
    </div>
  </div>
  <!-- a shell in my folder (chat/shell.ts): drag its top edge to make it taller -->
  <div id="shell" hidden>
    <div id="sh-grip" title="Drag to resize" aria-hidden="true"></div>
    <div class="sh-bar">
      <div id="sh-tabs" role="tablist" aria-label="Shells"></div>
      <button id="sh-new" type="button" title="New shell (Ctrl+Shift+`)" data-icon="plus"></button>
      <button id="sh-kind" type="button" title="Shell type" data-icon="down" hidden></button>
      <div id="sh-menu" role="menu" hidden></div>
      <span class="spacer"></span>
      <button id="sh-restart" type="button" title="Restart shell" data-icon="reset"></button>
      <button id="sh-hide" type="button" title="Hide shells (Ctrl+`)" data-icon="down"></button>
    </div>
    <div id="sh-term"></div>
  </div>
  <div id="attachments" aria-label="Files for the next question" hidden></div>
  <div id="screen-asks" aria-label="Ask about the part of the screen you boxed" hidden></div>
  <div id="brainbar">
    <button id="brain-model" type="button" title="Model"></button>
    <button id="brain-effort" type="button" title="Effort"></button>
    <button id="brain-mode" type="button" title="Mode"></button>
    <span class="spacer"></span>
    <button id="brain-meter" type="button" title="Context used">
      <span class="bm-label">ctx</span><span class="bm-bar"><i></i></span><span class="bm-pct">–</span>
    </button>
  </div>
  <div id="menu" role="menu" hidden></div>
  <div id="edit-banner" hidden><span></span><button type="button" id="edit-cancel" title="Cancel (Esc)">Cancel</button></div>
  <!-- formatting for what you type (Aa): markdown round the selection, and changes to the text -->
  <div id="fmt-bar" role="toolbar" aria-label="Formatting" hidden>
    <button type="button" data-fmt="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button type="button" data-fmt="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button type="button" data-fmt="strike" title="Strikethrough"><s>S</s></button>
    <button type="button" data-fmt="code" title="Code (Ctrl+E)"><code>&lt;/&gt;</code></button>
    <button type="button" data-fmt="block" title="Code block (Ctrl+Shift+E)"><code>{ }</code></button>
    <span class="fmt-sep"></span>
    <button type="button" data-fmt="bullet" title="Bulleted list">•≡</button>
    <button type="button" data-fmt="number" title="Numbered list">1.≡</button>
    <button type="button" data-fmt="quote" title="Quote">❝</button>
    <button type="button" data-fmt="link" title="Link (Ctrl+K)">🔗</button>
    <span class="fmt-sep"></span>
    <button type="button" data-fmt="transform" class="fmt-wide" title="Transform text">Aa ▾</button>
  </div>
  <form id="composer">
    <div id="palette" role="listbox" hidden></div>
    <button id="btn-attach" class="composer-btn" type="button" title="Add files" data-icon="plus"></button>
    <button id="btn-screen" class="composer-btn" type="button" title="Ask about screen" data-icon="scan"></button>
    <textarea id="input" rows="1" placeholder="Ask me something… (/ for commands, @ for files)" spellcheck="true"></textarea>
    <button id="btn-mic" class="composer-btn" type="button" title="Speak instead of typing" data-icon="mic" hidden></button>
    <button id="btn-format" class="composer-btn" type="button" title="Formatting" data-icon="text-box"></button>
    <button id="send" type="submit" title="Send (Enter)" data-icon="send"></button>
  </form>
  <div id="drop-hint" aria-hidden="true">Drop files to attach</div>
  <div class="tail" aria-hidden="true"></div>
  <div class="resize-grip" title="Drag to resize" aria-hidden="true"></div>
  <!-- and its height: the edge away from the robot's end of the screen (double-click: full height) -->
  <div class="resize-grip-v" title="Drag to resize" aria-hidden="true"></div>
  <!-- and the corner between them: both at once -->
  <div class="resize-grip-d" title="Drag to resize both ways (double-click: back to normal)" aria-hidden="true"></div>
</section>

<!-- While it works with the chat tucked away: what it's doing, and a way back in -->
<div id="working" role="status" hidden>
  <span class="dots"><i></i><i></i><i></i></span>
  <span id="working-text"></span>
  <button id="btn-bonk-working" class="bonk-btn" type="button" title="Bonk!" data-icon="hammer"></button>
  <button id="btn-peek" type="button" title="Open chat" data-icon="chat"></button>
</div>

<!-- Running commentary: a thought bubble next to the robot's head -->
<div id="aside" aria-live="polite" hidden></div>

<!-- The robot -->
<div id="robot" class="robot">
  <div id="pop" aria-live="polite"></div>
  <!-- out for a walk: what a click on the empty desk says -->
  <div id="away-note" role="status" aria-live="polite"></div>
  <div id="badge" aria-hidden="true">!</div>
  <!-- Ctrl+clicked for the stage: its number in the cast -->
  <div id="stage-pick" aria-hidden="true" hidden></div>

  <div id="bot-host"></div>
  <div id="nametag"></div>
  <!-- work handed between robots: a tag for each task (robot.js renderTasks) -->
  <div id="tasks" hidden></div>
  <!-- the mouse over the corkboard, the hammer or the plug -->
  <div id="board-label" aria-hidden="true"></div>
</div>


<!-- On the stage: the gaps between tiles, to drag (each window has its half of every gap) -->
<div class="stage-edge" data-side="left" hidden></div>
<div class="stage-edge" data-side="right" hidden></div>
<div class="stage-edge" data-side="top" hidden></div>
<div class="stage-edge" data-side="bottom" hidden></div>
