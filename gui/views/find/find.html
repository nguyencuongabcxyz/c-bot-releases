<article id="find">
  <header>
    <span id="kicker">Vietnamese → English</span>
    <button id="close" type="button" class="icon" title="Close" data-icon="x"></button>
  </header>
  <form id="ask" autocomplete="off">
    <span id="lens" data-icon="search"></span>
    <input id="q" type="text" spellcheck="false" maxlength="300" placeholder="Type it in Vietnamese…" aria-label="Vietnamese" />
    <kbd>Enter</kbd>
  </form>
  <p id="hint">A word, a phrase, an idiom or a sentence. Nothing is kept until you <b>☆ Save</b> an English word.</p>
  <div id="looking" hidden>Finding the English…</div>
  <p id="failed" hidden></p>
  <ol id="choices" hidden></ol>
  <p id="tip" hidden></p>
</article>
