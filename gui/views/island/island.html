<!-- The robot island (island.ts): one dark strip flush against an edge of the screen. Only
     one layer shows at a time; the strip grows and shrinks to fit it. -->
<div id="island" aria-label="Your robots">
  <!-- at rest: every robot's face, and how many are out (or what a hidden one is up to) -->
  <div id="rest" class="layer">
    <div id="faces"></div>
    <div id="rest-text"></div>
  </div>
  <!-- hovered: a card for each robot, to bring it out or send it away -->
  <div id="panel" class="layer">
    <header>
      <b>Robots</b><span id="count"></span>
      <span class="spacer"></span>
      <button id="all-out" type="button">Show all</button>
      <button id="all-away" type="button">Hide all</button>
      <button id="workshop" type="button" class="icon" title="Workshop" data-icon="wrench"></button>
    </header>
    <div id="cards"></div>
    <div id="grip" title="Hold to move"></div>
  </div>
  <!-- news from a robot that's away: done, a snag, a question -->
  <div id="toast" class="layer" role="status" aria-live="polite">
    <button id="t-face" type="button" class="face big" title="Open chat"></button>
    <div class="t-words"><b id="t-title"></b><span id="t-text"></span></div>
    <div class="t-acts">
      <button id="t-go" type="button" class="pill primary"></button>
      <button id="t-no" type="button" class="pill"></button>
    </div>
    <div id="t-time"><i></i></div>
  </div>
</div>
