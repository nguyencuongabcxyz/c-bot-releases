[package]
name = "c-bot"
version = "2.0.3"
description = "Cartoon desktop robots that are secretly Claude Code"
edition = "2024"
rust-version = "1.99"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-log = "2.10.1"
# (a build run from source points Start with Windows at the installed app: hub.rs)
auto-launch = "0.6"
# pictures: thumbnails, screen captures, what's on the clipboard
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
# (preserve_order: c-bot.json keeps its keys in the order the Electron app wrote them)
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1.13.1"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# MCP Apps: talking to a tool's MCP server for its view (mcp_apps.rs); the same reqwest and
# rustls the updater already brings
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# a robot's WebView2 itself: hearing its page's process fail, nudging it to draw (revive.rs);
# the same version Tauri's wry uses
webview2-com = "0.39.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# the shell in a robot's chat (shell.rs): a pseudoconsole (ConPTY) to run it in
portable-pty = "0.9"
thiserror = "2.0.21"
log = "0.4.35"
# the context engine (context/): the code in a robot's folder read into symbols, the way
# editors read it (tree-sitter and its grammars), and walked the way git sees it (ignore)
tree-sitter = "0.27.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.4"
tree-sitter-php = "0.25.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "0.26.6"
ignore = "0.4.34"
# the context engine's store (context/store): PostgreSQL, downloaded the first time a robot
# switches the engine on and run by the app (postgresql_embedded), spoken to with sqlx (the
# one postgresql_embedded already brings); files told apart by content (blake3)
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
blake3 = "1.8.7"
# (the same tokio Tauri runs: telling whether a thread is one of its own, where waiting on the
# database must happen on another thread)
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
# its keyword search, an index derived from the store (context/keyword.rs)
tantivy = "0.27.0"
# its search by meaning (context/embed, context/vectors.rs): a small multilingual sentence model
# run by ONNX Runtime (ort; its DLL is downloaded with the model the first time it's needed,
# out of Microsoft's zip: the zip the updater already brings), its text cut into tokens
# (tokenizers); its vectors kept at half precision (half) in an HNSW index (usearch).
# ort is a release candidate, against AGENTS.md: its 2.0 line has only ever been one, and its
# last stable release (1.16, 2023) can't load a DLL from a path without unsafe code here
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# (not its defaults: their esaxx is C++ built on the static C runtime, which can't be linked
# with usearch's)
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
half = "2.7.1"
usearch = "2.26.6"
# a folder's files watched as they're saved (context/watch.rs), so its index follows them at
# once instead of walking the folder before each question (the 8 line: 9 is a release candidate)
notify = { version = "8.2.0", default-features = false }

# (the rules in AGENTS.md that a lint can check; thresholds and bans in clippy.toml)
[lints.clippy]
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"

# (the dependencies built fast in debug builds too: the context engine's keyword index and
# parsers are unusably slow unoptimized)
[profile.dev.package."*"]
opt-level = 2

# a small binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
