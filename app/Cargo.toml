[package]
name = "c-bot"
version = "1.9.0"
description = "Cartoon desktop robots that are secretly Claude Code"
edition = "2024"
rust-version = "1.99"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-log = "2.10.1"
# (a build run from source points Start with Windows at the installed app: hub.rs)
auto-launch = "0.6"
# pictures: thumbnails, screen captures, what's on the clipboard
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
# (preserve_order: c-bot.json keeps its keys in the order the Electron app wrote them)
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1.13.1"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# MCP Apps: talking to a tool's MCP server for its view (mcp_apps.rs); the same reqwest and
# rustls the updater already brings
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# a robot's WebView2 itself: hearing its page's process fail, nudging it to draw (revive.rs);
# the same version Tauri's wry uses
webview2-com = "0.39.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# the shell in a robot's chat (shell.rs): a pseudoconsole (ConPTY) to run it in
portable-pty = "0.9"
thiserror = "2.0.21"
log = "0.4.34"

# (the rules in AGENTS.md that a lint can check; thresholds and bans in clippy.toml)
[lints.clippy]
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"

# a small binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
