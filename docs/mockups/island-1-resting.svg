<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24304f"/><stop offset="1" stop-color="#4a3566"/></linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1426" flood-opacity="0.10"/></filter>
    <filter id="pop" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <clipPath id="scr"><rect x="40" y="40" width="880" height="440" rx="10"/></clipPath>
    <!-- 2D robot face: tinted by `color` -->
    <symbol id="bot" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/>
      <rect x="2" y="18" width="4" height="9" rx="2" fill="currentColor"/><rect x="34" y="18" width="4" height="9" rx="2" fill="currentColor"/>
      <rect x="5" y="10" width="30" height="25" rx="8" fill="currentColor"/>
      <rect x="9" y="15" width="22" height="14" rx="6" fill="#0e1424"/>
      <circle cx="15" cy="22" r="2.6" fill="#7df9ff"/><circle cx="25" cy="22" r="2.6" fill="#7df9ff"/>
    </symbol>
    <symbol id="bot-zz" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/>
      <rect x="2" y="18" width="4" height="9" rx="2" fill="currentColor"/><rect x="34" y="18" width="4" height="9" rx="2" fill="currentColor"/>
      <rect x="5" y="10" width="30" height="25" rx="8" fill="currentColor"/>
      <rect x="9" y="15" width="22" height="14" rx="6" fill="#0e1424"/>
      <path d="M12.5 22 q2.5 2 5 0 M22.5 22 q2.5 2 5 0" stroke="#7df9ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect width="960" height="660" fill="url(#bg)"/>
  <text x="24" y="24" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT I · THE ISLAND AT REST (replaces each robot peeking from the edge)</text>

  <!-- ===== the desktop ===== -->
  <g clip-path="url(#scr)">
    <rect x="40" y="40" width="880" height="440" fill="url(#wp)"/>
    <!-- some app window -->
    <rect x="110" y="120" width="380" height="260" rx="8" fill="#f8fafc" opacity="0.95"/>
    <rect x="110" y="120" width="380" height="28" rx="8" fill="#e2e8f0"/>
    <rect x="110" y="140" width="380" height="8" fill="#e2e8f0"/>
    <g fill="#cbd5e1"><rect x="130" y="170" width="220" height="8" rx="4"/><rect x="130" y="190" width="300" height="8" rx="4"/><rect x="130" y="210" width="260" height="8" rx="4"/><rect x="130" y="230" width="180" height="8" rx="4"/></g>
    <!-- taskbar -->
    <rect x="40" y="448" width="880" height="32" fill="#0b0f1a" opacity="0.85"/>
    <g fill="#475569"><rect x="440" y="456" width="16" height="16" rx="3"/><rect x="466" y="456" width="16" height="16" rx="3"/><rect x="492" y="456" width="16" height="16" rx="3"/></g>
    <!-- C-Bot out on the desk -->
    <ellipse cx="782" cy="444" rx="30" ry="4" fill="#000" opacity="0.3"/>
    <use href="#bot" x="740" y="360" width="84" height="84" style="color:#a78bfa"/>

    <!-- ===== THE ISLAND (resting) ===== -->
    <path d="M375,40 H585 V60 A16,16 0 0 1 569,76 H391 A16,16 0 0 1 375,60 Z" fill="#0b0f1a" filter="url(#pop)"/>
    <!-- English Tutor: away, asleep -->
    <circle cx="441" cy="58" r="12" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
    <use href="#bot-zz" x="432" y="48" width="18" height="18" style="color:#34d399" opacity="0.45"/>
    <!-- SC Culi: away, but working -->
    <circle cx="419" cy="58" r="12" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
    <use href="#bot" x="410" y="48" width="18" height="18" style="color:#60a5fa" opacity="0.5"/>
    <circle cx="419" cy="58" r="12.5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="48 30" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 419 58" to="360 419 58" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- C-Bot: out on the desk -->
    <circle cx="397" cy="58" r="12" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
    <use href="#bot" x="388" y="48" width="18" height="18" style="color:#a78bfa"/>
    <text x="462" y="62" font-size="11" fill="#cbd5e1">1 out · 2 away</text>
    <text x="566" y="62" font-size="10" fill="#64748b">▾</text>

    <!-- drag hint along the top edge -->
    <g stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" fill="none">
      <path d="M600,52 H700"/><path d="M360,52 H260"/>
    </g>
    <text x="704" y="56" font-size="11" fill="#e2e8f0" opacity="0.85">▸ hold &amp; drag</text>
    <text x="256" y="56" font-size="11" fill="#e2e8f0" opacity="0.85" text-anchor="end">◂</text>
  </g>

  <!-- numbered markers -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="397" cy="94" r="10" fill="#0ea5e9"/><text x="397" y="98">1</text>
    <circle cx="430" cy="94" r="10" fill="#0ea5e9"/><text x="430" y="98">2</text>
    <circle cx="720" cy="80" r="10" fill="#0ea5e9"/><text x="720" y="84">3</text>
    <circle cx="730" cy="360" r="10" fill="#0ea5e9"/><text x="730" y="364">4</text>
  </g>

  <!-- ===== notes ===== -->
  <g font-size="12">
    <rect x="40" y="500" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="62" cy="522" r="10" fill="#0ea5e9"/><text x="62" y="526" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="80" y="526" font-weight="700" fill="#0b1426">Every robot, one little island</text>
    <text x="80" y="546" fill="#475569">Bright faces are out on your desk, faded ones are tucked away.</text>

    <rect x="490" y="500" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="512" cy="522" r="10" fill="#0ea5e9"/><text x="512" y="526" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="530" y="526" font-weight="700" fill="#0b1426">Amber spinning ring = busy</text>
    <text x="530" y="546" fill="#475569">SC Culi is hidden but working. Sleepy eyes = asleep.</text>

    <rect x="40" y="576" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="62" cy="598" r="10" fill="#0ea5e9"/><text x="62" y="602" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="80" y="602" font-weight="700" fill="#0b1426">Press &amp; hold, then drag</text>
    <text x="80" y="622" fill="#475569">Slide it anywhere along any edge; it snaps flat and remembers.</text>

    <rect x="490" y="576" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="512" cy="598" r="10" fill="#0ea5e9"/><text x="512" y="602" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="530" y="602" font-weight="700" fill="#0b1426">Robots that are out stay put</text>
    <text x="530" y="622" fill="#475569">No more half-hidden robots on the edges. Hover the island for more.</text>
  </g>
</svg>
