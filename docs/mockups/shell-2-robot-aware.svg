<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1426" flood-opacity="0.18"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1426" flood-opacity="0.10"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="24" y="20" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT II · THE ROBOT KNOWS ABOUT THE SHELL</text>

  <!-- ===== chat bubble ===== -->
  <rect x="24" y="32" width="520" height="584" rx="16" fill="#fff" stroke="#ffb3d1" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="44" cy="56" r="5" fill="#16a34a"/>
  <text x="56" y="61" font-size="14" font-weight="700" fill="#0b1426">Pixel</text>
  <rect x="100" y="45" width="96" height="22" rx="11" fill="#ffe3ef" stroke="#ff5fa2"/>
  <text x="112" y="60" font-size="12" fill="#c21f68">▭ c-bot  ▾</text>
  <!-- shell button: open/live state -->
  <rect x="318" y="43" width="50" height="26" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="326" y="61" font-size="13" font-weight="700" fill="#047857" font-family="Cascadia Mono, Consolas, monospace">$_</text>
  <line x1="349" y1="47" x2="349" y2="65" stroke="#86d6b4"/>
  <text x="353" y="60" font-size="10" fill="#047857">▾</text>
  <circle cx="366" cy="45" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
  <g font-size="14" fill="#4b5568" text-anchor="middle">
    <text x="388" y="61" font-family="Cascadia Mono, Consolas, monospace" font-size="13">&gt;_</text>
    <text x="414" y="61">◷</text><text x="440" y="61">⚒</text><text x="466" y="61">↻</text><text x="492" y="61">⤡</text><text x="518" y="61">☾</text>
  </g>
  <line x1="24" y1="80" x2="544" y2="80" stroke="#e8eef7"/>
  <circle cx="46" cy="96" r="3" fill="#94a3b8"/>
  <text x="56" y="100" font-size="12.5" fill="#0b1426">Add a cart test</text>
  <text x="170" y="100" font-size="11" fill="#94a3b8">×</text>
  <text x="196" y="100" font-size="13" fill="#64748b">+</text>
  <line x1="34" y1="111" x2="184" y2="111" stroke="#ff5fa2" stroke-width="2"/>
  <line x1="24" y1="112" x2="544" y2="112" stroke="#e8eef7"/>

  <!-- user msg -->
  <rect x="248" y="250" width="272" height="34" rx="12" fill="#fff0f6" stroke="#ffc4dc"/>
  <text x="262" y="272" font-size="13" fill="#0b1426">How do I run the new test?</text>
  <!-- robot reply -->
  <text x="44" y="310" font-size="13" fill="#0b1426">Run it from the project folder:</text>
  <rect x="44" y="322" width="476" height="76" rx="10" fill="#0e1424"/>
  <rect x="44" y="322" width="476" height="28" rx="10" fill="#1a2238"/>
  <rect x="44" y="340" width="476" height="10" fill="#1a2238"/>
  <text x="58" y="340" font-size="11" fill="#94a3b8" font-family="Cascadia Mono, Consolas, monospace">powershell</text>
  <text x="372" y="340" font-size="11" fill="#cbd5e1">⧉ Copy</text>
  <rect x="420" y="327" width="92" height="19" rx="9.5" fill="#ff5fa2"/>
  <text x="466" y="341" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">▶ Run in shell</text>
  <text x="58" y="380" font-size="13" fill="#e2e8f0" font-family="Cascadia Mono, Consolas, monospace">node --test src/</text>
  <text x="44" y="424" font-size="13" fill="#0b1426">It should print <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="12">pass 3</tspan> when everything's fine.</text>

  <!-- toast -->
  <g filter="url(#pop)"><rect x="64" y="462" width="440" height="40" rx="12" fill="#0b1426"/></g>
  <text x="80" y="487" font-size="12.5" fill="#e6f1ff">$_  Typed into your shell: <tspan font-family="Cascadia Mono, Consolas, monospace" fill="#7ff3ff">node --test src/</tspan> · Enter to run</text>

  <!-- composer -->
  <text x="44" y="528" font-size="11.5" fill="#4b5568">⚙ Default ▾    ϟ auto ▾</text>
  <rect x="40" y="544" width="488" height="56" rx="14" fill="#fff" stroke="#ff5fa2" stroke-width="1.5"/>
  <text x="62" y="577" font-size="13" fill="#94a3b8">Ask me something... (/ for commands, @ for files)</text>
  <circle cx="504" cy="572" r="15" fill="#ff5fa2"/>
  <text x="504" y="577" font-size="14" fill="#fff" text-anchor="middle">↑</text>

  <!-- folder chip dropdown -->
  <g filter="url(#pop)"><rect x="100" y="74" width="250" height="160" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="114" y="96" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">OPEN A SHELL IN…</text>
  <text x="114" y="122" font-size="13" fill="#0b1426">c-bot <tspan fill="#94a3b8" font-size="11.5">(the robot's folder)</tspan></text>
  <rect x="108" y="130" width="234" height="28" rx="7" fill="#ffe3ef"/>
  <text x="114" y="149" font-size="13" fill="#0b1426" font-family="Cascadia Mono, Consolas, monospace">src/</text>
  <text x="334" y="149" font-size="11" fill="#c21f68" text-anchor="end">just edited here</text>
  <text x="114" y="177" font-size="13" fill="#0b1426" font-family="Cascadia Mono, Consolas, monospace">gui/views/robot/</text>
  <line x1="110" y1="190" x2="340" y2="190" stroke="#e8eef7"/>
  <text x="114" y="214" font-size="12.5" fill="#2c3a55">▭  Open in Explorer instead</text>

  <!-- ===== right: robot with visor ===== -->
  <text x="580" y="52" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">WHILE A SHELL IS OPEN</text>
  <rect x="580" y="62" width="360" height="250" rx="14" fill="#ffffff" fill-opacity="0.55" stroke="#d6dbe5"/>
  <!-- speech -->
  <rect x="770" y="80" width="156" height="44" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <path d="M790 124 l-8 12 l18 -12z" fill="#fff" stroke="#e2e8f0"/>
  <text x="784" y="99" font-size="11.5" fill="#0b1426">Terminal's open in</text>
  <text x="784" y="115" font-size="11.5" fill="#0b1426" font-family="Cascadia Mono, Consolas, monospace">c-bot/src</text>
  <!-- robot -->
  <line x1="700" y1="104" x2="700" y2="124" stroke="#d64b8b" stroke-width="4"/>
  <circle cx="700" cy="100" r="7" fill="#ff5fa2"/>
  <rect x="650" y="124" width="100" height="84" rx="30" fill="#ff7ab3"/>
  <rect x="664" y="140" width="72" height="50" rx="16" fill="#1d2235"/>
  <!-- visor -->
  <rect x="656" y="150" width="88" height="22" rx="8" fill="#16a34a" opacity="0.35" filter="url(#glow)"/>
  <rect x="660" y="152" width="80" height="18" rx="7" fill="#0b3b24" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="165" font-size="10" fill="#4ade80" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace">&gt;_ ▌</text>
  <rect x="664" y="212" width="72" height="62" rx="18" fill="#ff7ab3"/>
  <text x="700" y="252" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">A</text>
  <rect x="636" y="222" width="20" height="40" rx="10" fill="#ff9cc6"/>
  <rect x="744" y="222" width="20" height="40" rx="10" fill="#ff9cc6"/>
  <text x="760" y="290" font-size="11" fill="#2c3a55">green "hacker visor" on</text>

  <!-- notes -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="366" cy="32" r="9" fill="#7c6cf2"/><text x="366" y="36">1</text>
    <circle cx="354" cy="80" r="9" fill="#7c6cf2"/><text x="354" y="84">2</text>
    <circle cx="520" cy="318" r="9" fill="#7c6cf2"/><text x="520" y="322">3</text>
    <circle cx="508" cy="462" r="9" fill="#7c6cf2"/><text x="508" y="466">4</text>
    <circle cx="940" cy="62" r="9" fill="#7c6cf2"/><text x="940" y="66">5</text>
  </g>
  <rect x="580" y="336" width="360" height="200" rx="12" fill="#ffffff" fill-opacity="0.7" stroke="#d6dbe5"/>
  <g font-size="11.5" fill="#2c3a55">
    <text x="594" y="360"><tspan font-weight="700" fill="#7c6cf2">1</tspan>  The $_ button turns green while the bot's shell is open</text>
    <text x="594" y="386"><tspan font-weight="700" fill="#7c6cf2">2</tspan>  The folder chip offers subfolders, ranked by</text>
    <text x="608" y="402">where Claude just worked</text>
    <text x="594" y="428"><tspan font-weight="700" fill="#7c6cf2">3</tspan>  Shell code blocks get a "▶ Run in shell" button</text>
    <text x="594" y="454"><tspan font-weight="700" fill="#7c6cf2">4</tspan>  The command is typed in but not run.</text>
    <text x="608" y="470">You press Enter yourself, so nothing runs by surprise</text>
    <text x="594" y="496"><tspan font-weight="700" fill="#7c6cf2">5</tspan>  The robot shows a visor and says where</text>
    <text x="608" y="512">its terminal is open</text>
  </g>
</svg>
