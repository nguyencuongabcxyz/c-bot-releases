<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24304f"/><stop offset="1" stop-color="#4a3566"/></linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1426" flood-opacity="0.10"/></filter>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
    <clipPath id="scr"><rect x="40" y="40" width="880" height="440" rx="10"/></clipPath>
    <symbol id="bot" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/>
      <rect x="2" y="18" width="4" height="9" rx="2" fill="currentColor"/><rect x="34" y="18" width="4" height="9" rx="2" fill="currentColor"/>
      <rect x="5" y="10" width="30" height="25" rx="8" fill="currentColor"/>
      <rect x="9" y="15" width="22" height="14" rx="6" fill="#0e1424"/>
      <circle cx="15" cy="22" r="2.6" fill="#7df9ff"/><circle cx="25" cy="22" r="2.6" fill="#7df9ff"/>
    </symbol>
    <symbol id="bot-zz" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/>
      <rect x="2" y="18" width="4" height="9" rx="2" fill="currentColor"/><rect x="34" y="18" width="4" height="9" rx="2" fill="currentColor"/>
      <rect x="5" y="10" width="30" height="25" rx="8" fill="currentColor"/>
      <rect x="9" y="15" width="22" height="14" rx="6" fill="#0e1424"/>
      <path d="M12.5 22 q2.5 2 5 0 M22.5 22 q2.5 2 5 0" stroke="#7df9ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect width="960" height="660" fill="url(#bg)"/>
  <text x="24" y="24" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT II · HOVER THE ISLAND: THE PANEL SLIDES DOWN</text>

  <g clip-path="url(#scr)">
    <rect x="40" y="40" width="880" height="440" fill="url(#wp)"/>
    <rect x="110" y="120" width="380" height="260" rx="8" fill="#f8fafc" opacity="0.5"/>
    <rect x="40" y="448" width="880" height="32" fill="#0b0f1a" opacity="0.85"/>
    <g fill="#475569"><rect x="440" y="456" width="16" height="16" rx="3"/><rect x="466" y="456" width="16" height="16" rx="3"/><rect x="492" y="456" width="16" height="16" rx="3"/></g>
    <ellipse cx="782" cy="444" rx="30" ry="4" fill="#000" opacity="0.3"/>
    <use href="#bot" x="740" y="360" width="84" height="84" style="color:#a78bfa"/>

    <!-- ===== THE PANEL ===== -->
    <path d="M250,40 H710 V240 A22,22 0 0 1 688,262 H272 A22,22 0 0 1 250,240 Z" fill="#0b0f1a" stroke="#273049" filter="url(#pop)"/>
    <text x="272" y="66" font-size="13" font-weight="700" fill="#fff">Robots</text>
    <rect x="324" y="54" width="22" height="16" rx="8" fill="#1c2438"/><text x="335" y="66" font-size="10.5" fill="#94a3b8" text-anchor="middle">3</text>
    <text x="604" y="66" font-size="11.5" fill="#93c5fd" text-anchor="end">Show all</text>
    <text x="690" y="66" font-size="11.5" fill="#93c5fd" text-anchor="end">Hide all</text>

    <!-- card 1: C-Bot, out -->
    <rect x="272" y="80" width="132" height="148" rx="14" fill="#151c2c" stroke="#222b40"/>
    <circle cx="338" cy="118" r="28" fill="#1c2438"/>
    <use href="#bot" x="316" y="95" width="44" height="44" style="color:#a78bfa"/>
    <circle cx="358" cy="138" r="5.5" fill="#4ade80" stroke="#151c2c" stroke-width="2"/>
    <text x="338" y="166" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">C-Bot</text>
    <text x="338" y="183" font-size="11" fill="#94a3b8" text-anchor="middle">On your desk · idle</text>
    <rect x="284" y="196" width="108" height="24" rx="12" fill="none" stroke="#334155"/>
    <text x="338" y="212" font-size="11.5" fill="#cbd5e1" text-anchor="middle">Send away</text>

    <!-- card 2: SC Culi, away & working (hovered) -->
    <rect x="415" y="80" width="132" height="148" rx="14" fill="#1a2234" stroke="#fbbf24" stroke-opacity="0.5"/>
    <circle cx="481" cy="118" r="28" fill="#1c2438"/>
    <use href="#bot" x="459" y="95" width="44" height="44" style="color:#60a5fa" opacity="0.55"/>
    <circle cx="481" cy="118" r="30" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="120 69" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 481 118" to="360 481 118" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="481" y="166" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">SC Culi</text>
    <text x="481" y="183" font-size="11" fill="#fbbf24" text-anchor="middle">Building… · 0:42</text>
    <rect x="427" y="196" width="108" height="24" rx="12" fill="#e2e8f0"/>
    <text x="481" y="212" font-size="11.5" font-weight="600" fill="#0b1426" text-anchor="middle">Bring out</text>

    <!-- card 3: English Tutor, away & asleep -->
    <rect x="558" y="80" width="132" height="148" rx="14" fill="#151c2c" stroke="#222b40"/>
    <circle cx="624" cy="118" r="28" fill="#1c2438"/>
    <use href="#bot-zz" x="602" y="95" width="44" height="44" style="color:#34d399" opacity="0.5"/>
    <text x="646" y="100" font-size="10" font-weight="700" fill="#64748b">z</text><text x="652" y="93" font-size="8" font-weight="700" fill="#64748b">z</text>
    <text x="624" y="166" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">English Tutor</text>
    <text x="624" y="183" font-size="11" fill="#64748b" text-anchor="middle">Asleep · away</text>
    <rect x="570" y="196" width="108" height="24" rx="12" fill="#e2e8f0"/>
    <text x="624" y="212" font-size="11.5" font-weight="600" fill="#0b1426" text-anchor="middle">Bring out</text>

    <!-- grab handle -->
    <rect x="462" y="246" width="36" height="4" rx="2" fill="#334155"/>

    <!-- mouse pointer -->
    <path d="M500,206 l0,18 l4.5,-4.5 l3.5,7.5 l3,-1.4 l-3.5,-7.3 l6.3,0 z" fill="#fff" stroke="#0b1426" stroke-width="1.2"/>
  </g>

  <!-- markers -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="242" cy="208" r="10" fill="#0ea5e9"/><text x="242" y="212">1</text>
    <circle cx="481" cy="282" r="10" fill="#0ea5e9"/><text x="481" y="286">2</text>
    <circle cx="242" cy="118" r="10" fill="#0ea5e9"/><text x="242" y="122">3</text>
    <circle cx="718" cy="62" r="10" fill="#0ea5e9"/><text x="718" y="66">4</text>
  </g>
  <path d="M481,272 V190" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- notes -->
  <g font-size="12">
    <rect x="40" y="500" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="62" cy="522" r="10" fill="#0ea5e9"/><text x="62" y="526" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="80" y="526" font-weight="700" fill="#0b1426">Bring out · Send away</text>
    <text x="80" y="546" fill="#475569">One tap moves a robot between your desk and the island.</text>

    <rect x="490" y="500" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="512" cy="522" r="10" fill="#0ea5e9"/><text x="512" y="526" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="530" y="526" font-weight="700" fill="#0b1426">Live status from each robot</text>
    <text x="530" y="546" fill="#475569">What it's doing right now and for how long; idle / asleep otherwise.</text>

    <rect x="40" y="576" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="62" cy="598" r="10" fill="#0ea5e9"/><text x="62" y="602" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="80" y="602" font-weight="700" fill="#0b1426">Click a face to open its chat</text>
    <text x="80" y="622" fill="#475569">Brings it out first if it's away.</text>

    <rect x="490" y="576" width="430" height="64" rx="12" fill="#fff" filter="url(#soft)"/>
    <circle cx="512" cy="598" r="10" fill="#0ea5e9"/><text x="512" y="602" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="530" y="602" font-weight="700" fill="#0b1426">Show all · Hide all</text>
    <text x="530" y="622" fill="#475569">Mouse leaves → the panel slides back up into the island.</text>
  </g>
</svg>
