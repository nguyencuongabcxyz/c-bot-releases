<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1426" flood-opacity="0.18"/></filter>
    <symbol id="bot" viewBox="0 0 40 44">
      <line x1="20" y1="2" x2="20" y2="9" stroke="#334155" stroke-width="2"/><circle cx="20" cy="3" r="3" fill="#ff5fa2"/>
      <rect x="4" y="9" width="32" height="24" rx="8" fill="currentColor"/>
      <rect x="9" y="14" width="22" height="13" rx="5" fill="#0b1426"/>
      <circle cx="15" cy="20.5" r="2.4" fill="#7dd3fc"/><circle cx="25" cy="20.5" r="2.4" fill="#7dd3fc"/>
      <rect x="11" y="34" width="18" height="8" rx="3" fill="currentColor" opacity="0.8"/>
    </symbol>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="24" y="28" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT IV · SEND TO ALL</text>

  <!-- 1. typing -->
  <text x="24" y="60" font-size="12.5" font-weight="700" fill="#0b1426">① Type once, at the bottom of the stage</text>
  <g filter="url(#pop)"><rect x="24" y="72" width="912" height="92" rx="16" fill="#0b1426"/></g>
  <text x="42" y="104" font-size="17">📣</text>
  <text x="68" y="98" font-size="11" font-weight="700" fill="#ff8fc0" letter-spacing="0.5">SEND TO ALL</text>
  <text x="68" y="118" font-size="13" fill="#fff">What in your project would break if we moved to .NET 9?<tspan fill="#ff5fa2">|</tspan></text>
  <rect x="68" y="130" width="120" height="22" rx="6" fill="#1e293b" stroke="#334155"/><text x="78" y="145" font-size="11" fill="#cbd5e1">📄 upgrade-notes.md</text>
  <g font-size="11.5" font-weight="600">
    <rect x="560" y="88" width="62" height="26" rx="13" fill="#ffd0e3"/><text x="591" y="105" fill="#0b1426" text-anchor="middle">✓ C-bot</text>
    <rect x="628" y="88" width="72" height="26" rx="13" fill="#bfdbfe"/><text x="664" y="105" fill="#0b1426" text-anchor="middle">✓ SC Culi</text>
    <rect x="706" y="88" width="64" height="26" rx="13" fill="#bbf7d0"/><text x="738" y="105" fill="#0b1426" text-anchor="middle">✓ Tutor</text>
    <rect x="776" y="88" width="58" height="26" rx="13" fill="none" stroke="#475569" stroke-dasharray="3 2"/><text x="805" y="105" fill="#64748b" text-anchor="middle">Pixel</text>
  </g>
  <rect x="852" y="86" width="70" height="30" rx="15" fill="#ff5fa2"/><text x="887" y="106" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Send ➤</text>
  <text x="560" y="146" font-size="11" fill="#94a3b8">Chips: who gets it · Enter sends · Shift+Enter new line</text>

  <!-- 2. lands in each tile -->
  <text x="24" y="206" font-size="12.5" font-weight="700" fill="#0b1426">② It lands in each robot’s own chat, and they answer side by side</text>
  <!-- tile 1 -->
  <g filter="url(#pop)"><rect x="24" y="218" width="292" height="200" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <use href="#bot" x="32" y="222" width="24" height="27" color="#ffd0e3"/>
  <text x="62" y="240" font-size="12.5" font-weight="700" fill="#0b1426">C-bot</text><circle cx="108" cy="236" r="4" fill="#16a34a"/><text x="116" y="240" font-size="10.5" fill="#16a34a">done</text>
  <line x1="24" y1="254" x2="316" y2="254" stroke="#e8eef7"/>
  <rect x="96" y="264" width="208" height="46" rx="10" fill="#ffe3ef"/>
  <text x="106" y="279" font-size="9.5" font-weight="700" fill="#c21f68">📣 to C-bot, SC Culi, Tutor</text>
  <text x="106" y="296" font-size="10.5" fill="#0b1426">What in your project would br…</text>
  <rect x="36" y="320" width="250" height="84" rx="10" fill="#f1f5f9"/>
  <text x="46" y="338" font-size="10.5" fill="#0b1426">Nothing here, my liege — c-bot is</text>
  <text x="46" y="353" font-size="10.5" fill="#0b1426">Rust + TypeScript, no .NET at all.</text>
  <!-- tile 2 -->
  <g filter="url(#pop)"><rect x="334" y="218" width="292" height="200" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <use href="#bot" x="342" y="222" width="24" height="27" color="#bfdbfe"/>
  <text x="372" y="240" font-size="12.5" font-weight="700" fill="#0b1426">SC Culi</text><circle cx="430" cy="236" r="4" fill="#16a34a"/><text x="438" y="240" font-size="10.5" fill="#16a34a">reading 6 files…</text>
  <line x1="334" y1="254" x2="626" y2="254" stroke="#e8eef7"/>
  <rect x="406" y="264" width="208" height="46" rx="10" fill="#ffe3ef"/>
  <text x="416" y="279" font-size="9.5" font-weight="700" fill="#c21f68">📣 to C-bot, SC Culi, Tutor</text>
  <text x="416" y="296" font-size="10.5" fill="#0b1426">What in your project would br…</text>
  <rect x="346" y="320" width="250" height="38" rx="10" fill="#f1f5f9"/>
  <text x="356" y="343" font-size="10.5" fill="#64748b">◷ Grep “net8.0” · Read *.csproj …</text>
  <!-- tile 3 -->
  <g filter="url(#pop)"><rect x="644" y="218" width="292" height="200" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <use href="#bot" x="652" y="222" width="24" height="27" color="#bbf7d0"/>
  <text x="682" y="240" font-size="12.5" font-weight="700" fill="#0b1426">English Tutor</text><circle cx="776" cy="236" r="4" fill="#16a34a"/><text x="784" y="240" font-size="10.5" fill="#16a34a">writing…</text>
  <line x1="644" y1="254" x2="936" y2="254" stroke="#e8eef7"/>
  <rect x="716" y="264" width="208" height="46" rx="10" fill="#ffe3ef"/>
  <text x="726" y="279" font-size="9.5" font-weight="700" fill="#c21f68">📣 to C-bot, SC Culi, Tutor</text>
  <text x="726" y="296" font-size="10.5" fill="#0b1426">What in your project would br…</text>
  <rect x="656" y="320" width="250" height="56" rx="10" fill="#f1f5f9"/>
  <text x="666" y="340" font-size="10.5" fill="#0b1426">The API project targets net8.0;</text>
  <text x="666" y="355" font-size="10.5" fill="#0b1426">two packages pin old versions…</text>

  <!-- 3. rules -->
  <text x="24" y="456" font-size="12.5" font-weight="700" fill="#0b1426">③ The fine print</text>
  <g font-size="12" fill="#334155">
    <text x="36" y="482">• Each robot answers from its own folder, in its current chat tab: no new “group chat”, no robots talking to each other.</text>
    <text x="36" y="504">• A robot that’s busy queues it and answers when it’s free; its chip shows <tspan font-weight="700">⏳</tspan>. One that needs permission flags “needs you” in its tile.</text>
    <text x="36" y="526">• Files you attach go to every chosen robot. Each tile’s own box still talks to that robot alone.</text>
    <text x="36" y="548">• Leaving a robot out is just clicking its chip. The choice holds until you change it.</text>
    <text x="36" y="570" fill="#64748b">• Later, maybe: “⇆ Compare answers” once they’re all done, to sum the replies up in one place.</text>
  </g>
</svg>
