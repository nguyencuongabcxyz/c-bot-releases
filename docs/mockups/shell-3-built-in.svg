<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1426" flood-opacity="0.22"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1426" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="24" y="20" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT III · A TERMINAL INSIDE THE BUBBLE</text>

  <!-- ===== chat bubble ===== -->
  <rect x="24" y="32" width="520" height="584" rx="16" fill="#fff" stroke="#ffb3d1" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="44" cy="56" r="5" fill="#16a34a"/>
  <text x="56" y="61" font-size="14" font-weight="700" fill="#0b1426">Pixel</text>
  <rect x="100" y="45" width="84" height="22" rx="11" fill="#fff" stroke="#d6dbe5"/>
  <text x="112" y="60" font-size="12" fill="#2c3a55">▭ c-bot</text>
  <rect x="318" y="43" width="50" height="26" rx="8" fill="#ffe3ef" stroke="#ff5fa2" stroke-width="1.5"/>
  <text x="326" y="61" font-size="13" font-weight="700" fill="#c21f68" font-family="Cascadia Mono, Consolas, monospace">$_</text>
  <line x1="349" y1="47" x2="349" y2="65" stroke="#ff9cc6"/>
  <text x="353" y="60" font-size="10" fill="#c21f68">▾</text>
  <g font-size="14" fill="#4b5568" text-anchor="middle">
    <text x="388" y="61" font-family="Cascadia Mono, Consolas, monospace" font-size="13">&gt;_</text>
    <text x="414" y="61">◷</text><text x="440" y="61">⚒</text><text x="466" y="61">↻</text><text x="492" y="61">⤡</text><text x="518" y="61">☾</text>
  </g>
  <line x1="24" y1="80" x2="544" y2="80" stroke="#e8eef7"/>
  <circle cx="46" cy="96" r="3" fill="#94a3b8"/>
  <text x="56" y="100" font-size="12.5" fill="#0b1426">Fix typecheck</text>
  <text x="196" y="100" font-size="13" fill="#64748b">+</text>
  <line x1="34" y1="111" x2="174" y2="111" stroke="#ff5fa2" stroke-width="2"/>
  <line x1="24" y1="112" x2="544" y2="112" stroke="#e8eef7"/>

  <!-- chat, now shorter -->
  <g opacity="0.55">
    <rect x="44" y="128" width="420" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="144" width="360" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="160" width="250" height="7" rx="3.5" fill="#cbd5e1"/>
  </g>

  <!-- ===== terminal drawer ===== -->
  <rect x="34" y="184" width="500" height="290" rx="12" fill="#0c0f1a" stroke="#2a3350"/>
  <rect x="34" y="184" width="500" height="32" rx="12" fill="#161b2c"/>
  <rect x="34" y="204" width="500" height="12" fill="#161b2c"/>
  <rect x="270" y="188" width="28" height="4" rx="2" fill="#3b4566"/>
  <!-- drawer tabs -->
  <rect x="42" y="192" width="120" height="22" rx="6" fill="#0c0f1a"/>
  <text x="54" y="207" font-size="11.5" fill="#e2e8f0">⌁ pwsh · c-bot</text>
  <text x="150" y="207" font-size="10" fill="#64748b">×</text>
  <text x="172" y="207" font-size="11.5" fill="#94a3b8">⌁ bun dev</text>
  <text x="240" y="207" font-size="13" fill="#94a3b8">+</text>
  <text x="520" y="207" font-size="12" fill="#94a3b8" text-anchor="end">⤢   ▾   ✕</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="11.5">
    <text x="48" y="240"><tspan fill="#7ff3ff">PS</tspan> <tspan fill="#e2e8f0">…\c-bot&gt; bun run typecheck</tspan></text>
    <text x="48" y="260" fill="#94a3b8">$ tsc -p . &amp;&amp; tsc -p tsconfig.node.json</text>
    <rect x="44" y="270" width="482" height="38" fill="#5b2a48"/>
    <text x="48" y="284" fill="#ffb3c7">gui/views/robot/robot.ts(2268,11): error TS2345:</text>
    <text x="48" y="301" fill="#ffb3c7">  Argument of type 'string | null' is not assignable…</text>
    <text x="48" y="322" fill="#e2e8f0">Found 1 error in gui/views/robot/robot.ts<tspan fill="#94a3b8">:2268</tspan></text>
    <text x="48" y="342" fill="#f87171">error: script "typecheck" exited with code 2</text>
    <text x="48" y="366"><tspan fill="#7ff3ff">PS</tspan> <tspan fill="#e2e8f0">…\c-bot&gt; </tspan><tspan fill="#ff5fa2">▌</tspan></text>
  </g>
  <!-- floating ask pill over the selection -->
  <g filter="url(#pop)">
    <rect x="300" y="236" width="176" height="28" rx="14" fill="#ff5fa2"/>
  </g>
  <text x="388" y="255" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">✦ Ask Pixel about this</text>
  <path d="M380 264 l8 7 l8 -7z" fill="#ff5fa2"/>
  <!-- status line -->
  <text x="48" y="462" font-size="10.5" fill="#64748b">pwsh · 120×18 · exit code 2</text>
  <text x="520" y="462" font-size="10.5" fill="#64748b" text-anchor="end">drag the top edge to resize</text>

  <!-- composer with attached terminal output -->
  <text x="44" y="498" font-size="11.5" fill="#4b5568">⚙ Default ▾    ϟ auto ▾</text>
  <rect x="40" y="510" width="488" height="90" rx="14" fill="#fff" stroke="#ff5fa2" stroke-width="1.5"/>
  <rect x="54" y="520" width="214" height="24" rx="12" fill="#f3f7fc" stroke="#d6dbe5"/>
  <text x="66" y="536" font-size="11.5" fill="#2c3a55">⌁ terminal output · 2 lines   ×</text>
  <text x="58" y="572" font-size="13" fill="#0b1426">Why does this fail? Fix it please<tspan fill="#ff5fa2">▌</tspan></text>
  <circle cx="504" cy="572" r="15" fill="#ff5fa2"/>
  <text x="504" y="577" font-size="14" fill="#fff" text-anchor="middle">↑</text>

  <!-- notes -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="34" cy="184" r="9" fill="#7c6cf2"/><text x="34" y="188">1</text>
    <circle cx="266" cy="203" r="9" fill="#7c6cf2"/><text x="266" y="207">2</text>
    <circle cx="482" cy="236" r="9" fill="#7c6cf2"/><text x="482" y="240">3</text>
    <circle cx="276" cy="520" r="9" fill="#7c6cf2"/><text x="276" y="524">4</text>
  </g>
  <rect x="572" y="32" width="368" height="300" rx="12" fill="#ffffff" fill-opacity="0.7" stroke="#d6dbe5"/>
  <g font-size="11.5" fill="#2c3a55">
    <text x="586" y="58"><tspan font-weight="700" fill="#7c6cf2">1</tspan>  A real terminal drawer slides out between chat</text>
    <text x="600" y="74">and composer. Clicking $_ shows or hides it</text>
    <text x="586" y="102"><tspan font-weight="700" fill="#7c6cf2">2</tspan>  It has tabs, e.g. one shell and one long-running</text>
    <text x="600" y="118"><tspan font-family="Cascadia Mono, Consolas, monospace" font-size="11">bun dev</tspan>. ⤢ pops it out to a full window</text>
    <text x="586" y="146"><tspan font-weight="700" fill="#7c6cf2">3</tspan>  Select any output and "Ask Pixel about this"</text>
    <text x="600" y="162">sends it to the chat</text>
    <text x="586" y="190"><tspan font-weight="700" fill="#7c6cf2">4</tspan>  The output is attached as a chip, so your</text>
    <text x="600" y="206">message stays short</text>
    <line x1="586" y1="226" x2="926" y2="226" stroke="#e2e8f0"/>
    <text x="586" y="250" font-weight="700" fill="#0b1426">Under the hood</text>
    <text x="586" y="272">xterm.js in the webview  ⇄  Tauri events  ⇄</text>
    <text x="586" y="290">ConPTY via the <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="11">portable-pty</tspan> crate in Rust.</text>
    <text x="586" y="312">The shell is killed when the robot sleeps or quits.</text>
  </g>
</svg>
