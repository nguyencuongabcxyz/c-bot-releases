<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1426" flood-opacity="0.18"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <symbol id="bot" viewBox="0 0 40 44">
      <line x1="20" y1="2" x2="20" y2="9" stroke="#334155" stroke-width="2"/><circle cx="20" cy="3" r="3" fill="#ff5fa2"/>
      <rect x="4" y="9" width="32" height="24" rx="8" fill="currentColor"/>
      <rect x="9" y="14" width="22" height="13" rx="5" fill="#0b1426"/>
      <circle cx="15" cy="20.5" r="2.4" fill="#7dd3fc"/><circle cx="25" cy="20.5" r="2.4" fill="#7dd3fc"/>
      <rect x="11" y="34" width="18" height="8" rx="3" fill="currentColor" opacity="0.8"/>
    </symbol>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="24" y="28" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT I · CHOOSING THE CAST</text>
  <text x="24" y="46" font-size="12" fill="#64748b">Ctrl+click robots on the desktop (or drag a lasso round them). Chosen ones glow and get a number. The stage opens on the screen your cursor is on.</text>

  <!-- robots on the desktop -->
  <g>
    <circle cx="150" cy="200" r="38" fill="#ff5fa2" opacity="0.45" filter="url(#glow)"/>
    <use href="#bot" x="120" y="166" width="60" height="66" color="#ffd0e3"/>
    <circle cx="178" cy="170" r="11" fill="#ff5fa2" stroke="#fff" stroke-width="2"/><text x="178" y="174.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="150" y="250" font-size="12" font-weight="600" fill="#0b1426" text-anchor="middle">C-bot</text>
  </g>
  <g>
    <circle cx="420" cy="150" r="38" fill="#ff5fa2" opacity="0.45" filter="url(#glow)"/>
    <use href="#bot" x="390" y="116" width="60" height="66" color="#bfdbfe"/>
    <circle cx="448" cy="120" r="11" fill="#ff5fa2" stroke="#fff" stroke-width="2"/><text x="448" y="124.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="420" y="200" font-size="12" font-weight="600" fill="#0b1426" text-anchor="middle">SC Culi</text>
  </g>
  <g>
    <circle cx="300" cy="360" r="38" fill="#ff5fa2" opacity="0.25" filter="url(#glow)"/>
    <use href="#bot" x="270" y="326" width="60" height="66" color="#bbf7d0"/>
    <text x="300" y="410" font-size="12" font-weight="600" fill="#0b1426" text-anchor="middle">English Tutor</text>
    <!-- cursor ctrl-clicking -->
    <path d="M318 352 l0 22 l6 -5 l4 9 l4 -2 l-4 -9 l8 0 z" fill="#0b1426" stroke="#fff" stroke-width="1.2"/>
    <rect x="336" y="378" width="40" height="18" rx="4" fill="#0b1426"/><text x="356" y="391" font-size="10.5" fill="#fff" text-anchor="middle">Ctrl</text>
  </g>
  <g opacity="0.55">
    <use href="#bot" x="560" y="300" width="60" height="66" color="#fde68a"/>
    <text x="590" y="384" font-size="12" font-weight="600" fill="#0b1426" text-anchor="middle">Pixel (asleep)</text>
  </g>

  <!-- floating action pill -->
  <g filter="url(#pop)">
    <rect x="240" y="480" width="420" height="52" rx="26" fill="#0b1426"/>
  </g>
  <text x="268" y="511" font-size="13.5" fill="#fff"><tspan font-weight="700">3 robots</tspan><tspan fill="#94a3b8"> chosen</tspan></text>
  <rect x="384" y="491" width="138" height="30" rx="15" fill="#ff5fa2"/>
  <text x="453" y="511" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">▦  Take the stage</text>
  <rect x="530" y="491" width="80" height="30" rx="15" fill="#1e293b" stroke="#334155"/>
  <text x="570" y="511" font-size="12" fill="#cbd5e1" text-anchor="middle">Layout ▾</text>
  <text x="632" y="512" font-size="15" fill="#94a3b8" text-anchor="middle">×</text>
  <text x="450" y="556" font-size="11.5" fill="#64748b" text-anchor="middle">Esc clears the choice · Enter takes the stage</text>

  <!-- tray / hub alternative -->
  <g filter="url(#pop)"><rect x="700" y="250" width="236" height="232" rx="12" fill="#fff"/></g>
  <text x="716" y="276" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">OR FROM THE TRAY</text>
  <text x="716" y="302" font-size="13" font-weight="600" fill="#0b1426">▦ Arrange on stage</text>
  <line x1="716" y1="314" x2="920" y2="314" stroke="#e8eef7"/>
  <g font-size="13" fill="#0b1426">
    <rect x="716" y="326" width="16" height="16" rx="4" fill="#ff5fa2"/><text x="719" y="339" fill="#fff" font-size="12">✓</text><text x="742" y="339">C-bot</text>
    <rect x="716" y="352" width="16" height="16" rx="4" fill="#ff5fa2"/><text x="719" y="365" fill="#fff" font-size="12">✓</text><text x="742" y="365">SC Culi</text>
    <rect x="716" y="378" width="16" height="16" rx="4" fill="#ff5fa2"/><text x="719" y="391" fill="#fff" font-size="12">✓</text><text x="742" y="391">English Tutor</text>
    <rect x="716" y="404" width="16" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="742" y="417" fill="#64748b">Pixel</text>
  </g>
  <line x1="716" y1="430" x2="920" y2="430" stroke="#e8eef7"/>
  <text x="716" y="452" font-size="12.5" fill="#0b1426">All awake robots</text><text x="920" y="452" font-size="11" fill="#94a3b8" text-anchor="end">Ctrl+Alt+G</text>
  <text x="716" y="472" font-size="12.5" fill="#0b1426">Last stage</text><text x="920" y="472" font-size="11" fill="#94a3b8" text-anchor="end">Ctrl+Alt+L</text>
</svg>
