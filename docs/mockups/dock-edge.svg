<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Segoe UI, sans-serif">
  <defs>
    <g id="bot">
      <line x1="24" y1="12" x2="24" y2="3" stroke="#555" stroke-width="2"/>
      <circle cx="24" cy="3" r="3" fill="#e85d5d"/>
      <rect x="2" y="12" width="44" height="36" rx="10" fill="#f2c14e" stroke="#8a6d1f" stroke-width="1.5"/>
      <rect x="9" y="20" width="30" height="16" rx="6" fill="#2b2b2b"/>
      <circle cx="17" cy="28" r="3" fill="#7fe3ff"/><circle cx="31" cy="28" r="3" fill="#7fe3ff"/>
      <rect x="10" y="48" width="8" height="6" rx="2" fill="#8a6d1f"/><rect x="30" y="48" width="8" height="6" rx="2" fill="#8a6d1f"/>
    </g>
  </defs>
  <rect width="520" height="320" fill="#f7f4ec"/>
  <rect x="10" y="10" width="500" height="280" rx="4" fill="#33415c"/>
  <rect x="10" y="276" width="500" height="14" fill="#1f2738"/>
  <!-- docked chat: flush, full height, no gap -->
  <g transform="translate(300 10)">
    <rect width="210" height="266" fill="#fdfaf3" stroke="#c9bfa6"/>
    <rect width="210" height="30" fill="#e9e2d0"/>
    <use href="#bot" transform="translate(6 3) scale(0.45)"/>
    <text x="32" y="19" font-size="10" font-weight="bold" fill="#444">C-Bot</text>
    <text x="70" y="19" font-size="9" fill="#888">· c-bot</text>
    <text x="164" y="20" font-size="12" fill="#666">⇱</text>
    <text x="184" y="20" font-size="12" fill="#666">×</text>
    <rect x="10" y="42" width="130" height="18" rx="6" fill="#e6eefc"/>
    <rect x="70" y="68" width="130" height="26" rx="6" fill="#fff1d6"/>
    <rect x="10" y="102" width="150" height="34" rx="6" fill="#e6eefc"/>
    <rect x="60" y="144" width="140" height="18" rx="6" fill="#fff1d6"/>
    <rect x="10" y="236" width="190" height="20" rx="6" fill="#fff" stroke="#c9bfa6"/>
    <line x1="0" y1="0" x2="0" y2="266" stroke="#ffd166" stroke-width="3" stroke-dasharray="2 4"/>
  </g>
  <line x1="509" y1="10" x2="509" y2="276" stroke="#6bffb0" stroke-width="3"/>
  <text x="26" y="40" font-size="11" fill="#fff">Push the robot into the edge</text>
  <text x="26" y="55" font-size="11" fill="#fff">→ the chat <tspan fill="#6bffb0">docks</tspan> flush, full height.</text>
  <text x="26" y="80" font-size="11" fill="#fff">The robot lives in the title bar</text>
  <text x="26" y="95" font-size="11" fill="#fff">(like on the Stage).</text>
  <text x="26" y="125" font-size="10" fill="#b8c4dc">⇱ or drag the title bar away → undock</text>
  <text x="26" y="139" font-size="10" fill="#b8c4dc">Drag the <tspan fill="#ffd166">inner edge</tspan> to resize</text>
  <text x="14" y="308" font-size="13" font-weight="bold" fill="#333">Docked at the screen's edge</text>
  <text x="506" y="308" font-size="10" fill="#777" text-anchor="end">the stage's look, flush with the edge</text>
</svg>
