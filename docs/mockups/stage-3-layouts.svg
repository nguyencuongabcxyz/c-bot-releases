<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="24" y="28" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT III · HOW THE STAGE SPLITS ITSELF</text>

  <!-- auto layouts -->
  <g font-size="12" fill="#0b1426" text-anchor="middle">
    <!-- 2 -->
    <rect x="24" y="50" width="160" height="96" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="30" y="56" width="72" height="84" rx="4" fill="#ffd0e3"/><rect x="106" y="56" width="72" height="84" rx="4" fill="#bfdbfe"/>
    <text x="104" y="164">2 · side by side</text>
    <!-- 3 -->
    <rect x="208" y="50" width="160" height="96" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="214" y="56" width="72" height="84" rx="4" fill="#ffd0e3"/><rect x="290" y="56" width="72" height="40" rx="4" fill="#bfdbfe"/><rect x="290" y="100" width="72" height="40" rx="4" fill="#bbf7d0"/>
    <text x="288" y="164">3 · lead + two</text>
    <!-- 4 -->
    <rect x="392" y="50" width="160" height="96" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="398" y="56" width="72" height="40" rx="4" fill="#ffd0e3"/><rect x="474" y="56" width="72" height="40" rx="4" fill="#bfdbfe"/><rect x="398" y="100" width="72" height="40" rx="4" fill="#bbf7d0"/><rect x="474" y="100" width="72" height="40" rx="4" fill="#fde68a"/>
    <text x="472" y="164">4 · 2×2</text>
    <!-- 5 -->
    <rect x="576" y="50" width="160" height="96" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="582" y="56" width="47" height="40" rx="4" fill="#ffd0e3"/><rect x="632" y="56" width="48" height="40" rx="4" fill="#bfdbfe"/><rect x="683" y="56" width="47" height="40" rx="4" fill="#bbf7d0"/>
    <rect x="582" y="100" width="72" height="40" rx="4" fill="#fde68a"/><rect x="658" y="100" width="72" height="40" rx="4" fill="#ddd6fe"/>
    <text x="656" y="164">5 · 3 over 2</text>
    <!-- 6 -->
    <rect x="760" y="50" width="160" height="96" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="766" y="56" width="47" height="40" rx="4" fill="#ffd0e3"/><rect x="816" y="56" width="48" height="40" rx="4" fill="#bfdbfe"/><rect x="867" y="56" width="47" height="40" rx="4" fill="#bbf7d0"/>
    <rect x="766" y="100" width="47" height="40" rx="4" fill="#fde68a"/><rect x="816" y="100" width="48" height="40" rx="4" fill="#ddd6fe"/><rect x="867" y="100" width="47" height="40" rx="4" fill="#fecaca"/>
    <text x="840" y="164">6 · 3×2</text>
  </g>
  <text x="24" y="190" font-size="11.5" fill="#64748b">Columns = as many as fit at ≥ 360 px each (the chat's minimum); rows fill up evenly, odd ones out get wider. Ultrawide? 3 goes 3-across.</text>

  <!-- resize rule -->
  <text x="24" y="228" font-size="12" font-weight="700" fill="#0b1426">Shrink one, the others take the space</text>
  <g>
    <rect x="24" y="240" width="420" height="90" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="30" y="246" width="134" height="78" rx="4" fill="#ffd0e3"/><rect x="168" y="246" width="134" height="78" rx="4" fill="#bfdbfe"/><rect x="306" y="246" width="132" height="78" rx="4" fill="#bbf7d0"/>
    <rect x="164" y="270" width="4" height="30" rx="2" fill="#ff5fa2"/>
    <text x="234" y="346" font-size="11.5" fill="#64748b" text-anchor="middle">before</text>
  </g>
  <text x="470" y="290" font-size="22" fill="#94a3b8">→</text>
  <g>
    <rect x="510" y="240" width="420" height="90" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="516" y="246" width="214" height="78" rx="4" fill="#ffd0e3"/><rect x="734" y="246" width="94" height="78" rx="4" fill="#bfdbfe"/><rect x="832" y="246" width="92" height="78" rx="4" fill="#bbf7d0"/>
    <rect x="730" y="270" width="4" height="30" rx="2" fill="#ff5fa2"/>
    <text x="720" y="346" font-size="11.5" fill="#64748b" text-anchor="middle">drag right: the neighbour gives way; once it is at its minimum, the next one does</text>
  </g>

  <!-- focus mode -->
  <text x="24" y="390" font-size="12" font-weight="700" fill="#0b1426">⤢ Spotlight one (header button / double-click a header)</text>
  <rect x="24" y="402" width="420" height="150" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <rect x="30" y="408" width="340" height="138" rx="4" fill="#ffd0e3"/>
  <text x="200" y="482" font-size="12" fill="#c21f68" text-anchor="middle">C-bot, centre stage</text>
  <rect x="374" y="408" width="64" height="44" rx="4" fill="#bfdbfe"/><rect x="374" y="455" width="64" height="44" rx="4" fill="#bbf7d0"/><rect x="374" y="502" width="64" height="44" rx="4" fill="#fde68a"/>
  <text x="406" y="434" font-size="9.5" fill="#1e3a8a" text-anchor="middle">SC Culi ●</text>
  <text x="406" y="481" font-size="9.5" fill="#14532d" text-anchor="middle">Tutor</text>
  <text x="406" y="528" font-size="9.5" fill="#713f12" text-anchor="middle">Pixel</text>
  <text x="234" y="572" font-size="11.5" fill="#64748b" text-anchor="middle">the others shrink to a strip: name, status dot, last line</text>

  <!-- exit -->
  <text x="510" y="390" font-size="12" font-weight="700" fill="#0b1426">⎋ Exit the stage</text>
  <rect x="510" y="402" width="420" height="150" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="12" fill="#0b1426">
    <text x="528" y="430">• The tiles fold up; each robot rolls back to its desk</text>
    <text x="528" y="454">   with its chat tucked (like the meeting room ends).</text>
    <text x="528" y="482">• ☆ Save keeps the cast + sizes as a named stage</text>
    <text x="528" y="506">   (“Morning standup”), reopened from the tray.</text>
    <text x="528" y="534">• ⇱ on a tile lets just that robot step off the stage.</text>
  </g>
</svg>
