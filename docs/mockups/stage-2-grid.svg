<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1426" flood-opacity="0.22"/></filter>
    <symbol id="bot" viewBox="0 0 40 44">
      <line x1="20" y1="2" x2="20" y2="9" stroke="#334155" stroke-width="2"/><circle cx="20" cy="3" r="3" fill="#ff5fa2"/>
      <rect x="4" y="9" width="32" height="24" rx="8" fill="currentColor"/>
      <rect x="9" y="14" width="22" height="13" rx="5" fill="#0b1426"/>
      <circle cx="15" cy="20.5" r="2.4" fill="#7dd3fc"/><circle cx="25" cy="20.5" r="2.4" fill="#7dd3fc"/>
      <rect x="11" y="34" width="18" height="8" rx="3" fill="currentColor" opacity="0.8"/>
    </symbol>
    <!-- a tile's chat: an older exchange, then the broadcast and the start of a reply -->
    <symbol id="talk" viewBox="0 0 300 150">
      <rect x="0" y="0" width="200" height="26" rx="9" fill="#f1f5f9"/>
      <rect x="120" y="36" width="180" height="40" rx="10" fill="#ffe3ef"/>
      <text x="130" y="51" font-size="9.5" font-weight="700" fill="#c21f68">📣 to all 4</text>
      <rect x="130" y="58" width="150" height="7" rx="3.5" fill="#ffb3d1"/>
      <rect x="0" y="88" width="250" height="40" rx="10" fill="#f1f5f9"/>
      <rect x="10" y="98" width="200" height="7" rx="3.5" fill="#cbd5e1"/><rect x="10" y="112" width="140" height="7" rx="3.5" fill="#cbd5e1"/>
    </symbol>
  </defs>
  <!-- the screen -->
  <rect width="960" height="600" fill="#cfd6e8"/>

  <!-- stage bar -->
  <g filter="url(#pop)"><rect x="300" y="6" width="360" height="28" rx="14" fill="#0b1426"/></g>
  <text x="318" y="25" font-size="12" font-weight="700" fill="#fff">▦ Stage</text>
  <text x="370" y="25" font-size="12" fill="#94a3b8">4 robots</text>
  <text x="438" y="25" font-size="12" fill="#cbd5e1">＋ Add</text>
  <text x="490" y="25" font-size="12" fill="#cbd5e1">Layout ▾</text>
  <text x="554" y="25" font-size="12" fill="#cbd5e1">☆ Save</text>
  <text x="608" y="25" font-size="12" fill="#ff8fc0">⎋ Exit</text>

  <!-- ===== tile A: C-bot (focused) ===== -->
  <g filter="url(#pop)"><rect x="8" y="42" width="568" height="250" rx="12" fill="#fff" stroke="#ff5fa2" stroke-width="2"/></g>
  <use href="#bot" x="16" y="46" width="28" height="31" color="#ffd0e3"/>
  <text x="50" y="66" font-size="13" font-weight="700" fill="#0b1426">C-bot</text>
  <rect x="96" y="53" width="66" height="18" rx="9" fill="#ffe3ef"/><text x="106" y="66" font-size="11" fill="#c21f68">▭ c-bot</text>
  <circle cx="174" cy="62" r="4" fill="#16a34a"/><text x="182" y="66" font-size="11" fill="#16a34a">thinking…</text>
  <text x="566" y="67" font-size="13" fill="#64748b" text-anchor="end">⤢   ⇱   ×</text>
  <line x1="8" y1="80" x2="576" y2="80" stroke="#e8eef7"/>
  <use href="#talk" x="24" y="90" width="300" height="150"/>
  <rect x="20" y="252" width="544" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="32" y="271" font-size="12" fill="#94a3b8">Message C-bot only…</text>

  <!-- ===== tile B: English Tutor ===== -->
  <g filter="url(#pop)"><rect x="8" y="300" width="568" height="196" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <use href="#bot" x="16" y="304" width="28" height="31" color="#bbf7d0"/>
  <text x="50" y="324" font-size="13" font-weight="700" fill="#0b1426">English Tutor</text>
  <rect x="146" y="311" width="96" height="18" rx="9" fill="#dcfce7"/><text x="156" y="324" font-size="11" fill="#15803d">▭ AI English…</text>
  <circle cx="254" cy="320" r="4" fill="#16a34a"/><text x="262" y="324" font-size="11" fill="#16a34a">writing…</text>
  <text x="566" y="325" font-size="13" fill="#64748b" text-anchor="end">⤢   ⇱   ×</text>
  <line x1="8" y1="338" x2="576" y2="338" stroke="#e8eef7"/>
  <use href="#talk" x="24" y="346" width="230" height="115"/>
  <rect x="20" y="456" width="544" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="32" y="475" font-size="12" fill="#94a3b8">Message English Tutor only…</text>

  <!-- ===== tile C: SC Culi ===== -->
  <g filter="url(#pop)"><rect x="592" y="42" width="360" height="180" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <use href="#bot" x="600" y="46" width="28" height="31" color="#bfdbfe"/>
  <text x="634" y="66" font-size="13" font-weight="700" fill="#0b1426">SC Culi</text>
  <circle cx="698" cy="62" r="4" fill="#f59e0b"/><text x="706" y="66" font-size="11" fill="#b45309">needs you</text>
  <text x="942" y="67" font-size="13" fill="#64748b" text-anchor="end">⤢   ⇱   ×</text>
  <line x1="592" y1="80" x2="952" y2="80" stroke="#e8eef7"/>
  <use href="#talk" x="606" y="88" width="180" height="90"/>
  <rect x="604" y="182" width="336" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="616" y="201" font-size="12" fill="#94a3b8">Message SC Culi only…</text>

  <!-- ===== tile D: Pixel (left out of this broadcast) ===== -->
  <g filter="url(#pop)"><rect x="592" y="230" width="360" height="266" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <use href="#bot" x="600" y="234" width="28" height="31" color="#fde68a"/>
  <text x="634" y="254" font-size="13" font-weight="700" fill="#0b1426">Pixel</text>
  <circle cx="680" cy="250" r="4" fill="#94a3b8"/><text x="688" y="254" font-size="11" fill="#64748b">idle</text>
  <text x="942" y="255" font-size="13" fill="#64748b" text-anchor="end">⤢   ⇱   ×</text>
  <line x1="592" y1="268" x2="952" y2="268" stroke="#e8eef7"/>
  <rect x="606" y="280" width="200" height="26" rx="9" fill="#f1f5f9"/>
  <rect x="740" y="316" width="196" height="26" rx="9" fill="#ffe3ef"/>
  <rect x="606" y="352" width="250" height="44" rx="10" fill="#f1f5f9"/>
  <rect x="604" y="456" width="336" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="616" y="475" font-size="12" fill="#94a3b8">Message Pixel only…</text>

  <!-- splitters -->
  <rect x="580" y="42" width="8" height="454" rx="4" fill="#ff5fa2" opacity="0.85"/>
  <rect x="581" y="250" width="6" height="40" rx="3" fill="#fff"/>
  <path d="M570 270 l-8 0 m0 0 l5 -5 m-5 5 l5 5 M598 270 l8 0 m0 0 l-5 -5 m5 5 l-5 5" stroke="#0b1426" stroke-width="2" fill="none"/>
  <rect x="200" y="294" width="180" height="4" rx="2" fill="#94a3b8" opacity="0.8"/>
  <rect x="712" y="224" width="120" height="4" rx="2" fill="#94a3b8" opacity="0.8"/>

  <!-- ===== send to all ===== -->
  <g filter="url(#pop)"><rect x="8" y="506" width="944" height="54" rx="16" fill="#0b1426"/></g>
  <text x="26" y="538" font-size="17">📣</text>
  <text x="52" y="530" font-size="11" font-weight="700" fill="#ff8fc0" letter-spacing="0.5">SEND TO ALL</text>
  <text x="52" y="547" font-size="12.5" fill="#94a3b8">Ask everyone on stage…</text>
  <g font-size="11.5" font-weight="600">
    <rect x="560" y="520" width="62" height="26" rx="13" fill="#ffd0e3"/><text x="591" y="537" fill="#0b1426" text-anchor="middle">✓ C-bot</text>
    <rect x="628" y="520" width="72" height="26" rx="13" fill="#bfdbfe"/><text x="664" y="537" fill="#0b1426" text-anchor="middle">✓ SC Culi</text>
    <rect x="706" y="520" width="64" height="26" rx="13" fill="#bbf7d0"/><text x="738" y="537" fill="#0b1426" text-anchor="middle">✓ Tutor</text>
    <rect x="776" y="520" width="58" height="26" rx="13" fill="none" stroke="#475569" stroke-dasharray="3 2"/><text x="805" y="537" fill="#64748b" text-anchor="middle">Pixel</text>
  </g>
  <text x="852" y="538" font-size="15" fill="#94a3b8">📎</text>
  <rect x="880" y="518" width="62" height="30" rx="15" fill="#ff5fa2"/><text x="911" y="538" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Send ➤</text>

  <!-- hint -->
  <text x="480" y="584" font-size="11.5" fill="#334155" text-anchor="middle">Drag a gap: neighbours give way · double-click it: even out · drag a header onto another: swap · click a chip to leave a robot out</text>
</svg>
