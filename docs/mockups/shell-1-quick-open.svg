<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1426" flood-opacity="0.18"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1426" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="24" y="20" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT I · OPEN A SHELL HERE (QUICK)</text>

  <!-- ===== chat bubble ===== -->
  <rect x="24" y="32" width="520" height="584" rx="16" fill="#fff" stroke="#ffb3d1" stroke-width="1.5" filter="url(#soft)"/>
  <!-- header -->
  <circle cx="44" cy="56" r="5" fill="#16a34a"/>
  <text x="56" y="61" font-size="14" font-weight="700" fill="#0b1426">Pixel</text>
  <rect x="100" y="45" width="84" height="22" rx="11" fill="#fff" stroke="#d6dbe5"/>
  <text x="112" y="60" font-size="12" fill="#2c3a55">▭ c-bot</text>
  <!-- NEW shell split button -->
  <rect x="318" y="43" width="50" height="26" rx="8" fill="#ffe3ef" stroke="#ff5fa2" stroke-width="1.5"/>
  <text x="326" y="61" font-size="13" font-weight="700" fill="#c21f68" font-family="Cascadia Mono, Consolas, monospace">$_</text>
  <line x1="349" y1="47" x2="349" y2="65" stroke="#ff9cc6"/>
  <text x="353" y="60" font-size="10" fill="#c21f68">▾</text>
  <!-- existing buttons -->
  <g font-size="14" fill="#4b5568" text-anchor="middle">
    <text x="388" y="61" font-family="Cascadia Mono, Consolas, monospace" font-size="13">&gt;_</text>
    <text x="414" y="61">◷</text>
    <text x="440" y="61">⚒</text>
    <text x="466" y="61">↻</text>
    <text x="492" y="61">⤡</text>
    <text x="518" y="61">☾</text>
  </g>
  <line x1="24" y1="80" x2="544" y2="80" stroke="#e8eef7"/>
  <!-- tabs -->
  <circle cx="46" cy="96" r="3" fill="#94a3b8"/>
  <text x="56" y="100" font-size="12.5" fill="#0b1426">Cart prices show as ...</text>
  <text x="212" y="100" font-size="11" fill="#94a3b8">×</text>
  <text x="240" y="100" font-size="13" fill="#64748b">+</text>
  <text x="262" y="100" font-size="12" fill="#64748b">↺</text>
  <line x1="34" y1="111" x2="226" y2="111" stroke="#ff5fa2" stroke-width="2"/>
  <line x1="24" y1="112" x2="544" y2="112" stroke="#e8eef7"/>
  <!-- faded chat body -->
  <g opacity="0.45">
    <rect x="200" y="132" width="320" height="44" rx="12" fill="#fff0f6" stroke="#ffc4dc"/>
    <rect x="214" y="146" width="250" height="7" rx="3.5" fill="#d9a3bb"/>
    <rect x="214" y="160" width="160" height="7" rx="3.5" fill="#d9a3bb"/>
    <rect x="44" y="196" width="440" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="212" width="380" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="228" width="300" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="252" width="476" height="120" rx="10" fill="#1d2235"/>
    <rect x="44" y="392" width="440" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="408" width="320" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="44" y="424" width="400" height="7" rx="3.5" fill="#cbd5e1"/>
  </g>
  <!-- composer -->
  <text x="44" y="528" font-size="11.5" fill="#4b5568">⚙ Default ▾    ϟ auto ▾</text>
  <text x="430" y="528" font-size="10.5" fill="#64748b">CTX ━━━━━━  5%</text>
  <rect x="40" y="544" width="488" height="56" rx="14" fill="#fff" stroke="#ff5fa2" stroke-width="1.5"/>
  <text x="62" y="577" font-size="13" fill="#94a3b8">Ask me something... (/ for commands, @ for files)</text>
  <circle cx="504" cy="572" r="15" fill="#ff5fa2"/>
  <text x="504" y="577" font-size="14" fill="#fff" text-anchor="middle">↑</text>

  <!-- dropdown from the split caret -->
  <g filter="url(#pop)">
    <rect x="186" y="76" width="236" height="232" rx="12" fill="#fff" stroke="#e2e8f0"/>
  </g>
  <text x="200" y="98" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">OPEN A SHELL IN c-bot</text>
  <rect x="194" y="108" width="220" height="28" rx="7" fill="#ffe3ef"/>
  <text x="206" y="127" font-size="13" fill="#0b1426">PowerShell 7 (pwsh)</text>
  <text x="400" y="127" font-size="13" fill="#c21f68" text-anchor="end">✓</text>
  <text x="206" y="155" font-size="13" fill="#0b1426">Windows PowerShell</text>
  <text x="206" y="183" font-size="13" fill="#0b1426">Command Prompt</text>
  <text x="206" y="211" font-size="13" fill="#0b1426">Git Bash</text>
  <text x="206" y="239" font-size="13" fill="#0b1426">WSL · Ubuntu</text>
  <line x1="196" y1="252" x2="412" y2="252" stroke="#e8eef7"/>
  <text x="206" y="273" font-size="12" fill="#2c3a55">Click $_ to open your default</text>
  <text x="206" y="293" font-size="12" fill="#64748b">Shortcut</text>
  <rect x="356" y="280" width="46" height="18" rx="4" fill="#f3f7fc" stroke="#d6dbe5"/>
  <text x="379" y="293" font-size="11" fill="#2c3a55" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace">Ctrl+`</text>

  <!-- ===== right: robot right-click menu ===== -->
  <text x="580" y="52" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">RIGHT-CLICK THE ROBOT / TRAY</text>
  <g filter="url(#pop)"><rect x="580" y="62" width="250" height="186" rx="10" fill="#fff" stroke="#e2e8f0"/></g>
  <g font-size="13" fill="#0b1426">
    <text x="596" y="88">Wake up</text>
    <text x="596" y="114">New tab</text>
    <text x="596" y="140">Open folder</text>
    <rect x="588" y="150" width="234" height="28" rx="6" fill="#ffe3ef"/>
    <text x="596" y="169" font-weight="600">Open shell here</text>
    <rect x="712" y="157" width="34" height="15" rx="7.5" fill="#ff5fa2"/>
    <text x="729" y="168" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">NEW</text>
    <text x="814" y="169" font-size="11" fill="#64748b" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace">Ctrl+`</text>
    <text x="596" y="200">Claude Code in terminal</text>
    <text x="596" y="232">Hide</text>
  </g>
  <line x1="590" y1="212" x2="820" y2="212" stroke="#e8eef7"/>

  <!-- ===== right: what opens ===== -->
  <text x="580" y="286" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.6">WHAT OPENS: WINDOWS TERMINAL, IN THE FOLDER</text>
  <g filter="url(#pop)"><rect x="580" y="296" width="360" height="176" rx="10" fill="#0c0c14"/></g>
  <rect x="580" y="296" width="360" height="30" rx="10" fill="#1f1f2b"/>
  <rect x="580" y="316" width="360" height="10" fill="#1f1f2b"/>
  <rect x="590" y="301" width="150" height="25" rx="6" fill="#0c0c14"/>
  <text x="602" y="318" font-size="11.5" fill="#e2e8f0">⌁ pwsh · c-bot (Pixel)</text>
  <text x="925" y="316" font-size="11" fill="#94a3b8" text-anchor="end">—  ▢  ✕</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="11.5">
    <text x="594" y="350" fill="#94a3b8">PowerShell 7.5.3</text>
    <text x="594" y="378" fill="#7ff3ff">PS</text>
    <text x="616" y="378" fill="#e2e8f0">C:\Users\you\Desktop\</text>
    <text x="594" y="396" fill="#e2e8f0">Personal Space\c-bot&gt; <tspan fill="#ff5fa2">▌</tspan></text>
  </g>

  <!-- ===== numbered notes ===== -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="316" cy="40" r="9" fill="#7c6cf2"/><text x="316" y="44">1</text>
    <circle cx="426" cy="84" r="9" fill="#7c6cf2"/><text x="426" y="88">2</text>
    <circle cx="836" cy="164" r="9" fill="#7c6cf2"/><text x="836" y="168">3</text>
    <circle cx="940" cy="296" r="9" fill="#7c6cf2"/><text x="940" y="300">4</text>
  </g>
  <rect x="580" y="496" width="360" height="120" rx="12" fill="#ffffff" fill-opacity="0.7" stroke="#d6dbe5"/>
  <g font-size="11.5" fill="#2c3a55">
    <text x="594" y="518"><tspan font-weight="700" fill="#7c6cf2">1</tspan>  New $_ button sits beside the Claude &gt;_ button</text>
    <text x="594" y="540"><tspan font-weight="700" fill="#7c6cf2">2</tspan>  The ▾ caret picks the shell; ✓ marks the default</text>
    <text x="594" y="562"><tspan font-weight="700" fill="#7c6cf2">3</tspan>  It's also in the robot and tray menus, with a shortcut</text>
    <text x="594" y="584"><tspan font-weight="700" fill="#7c6cf2">4</tspan>  Opens a normal terminal window. Click again and</text>
    <text x="608" y="602">the bot brings that window back instead of a new one</text>
  </g>
</svg>
