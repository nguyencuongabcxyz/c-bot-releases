<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7f5"/><stop offset="1" stop-color="#f1e6f2"/></linearGradient>
    <linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24304f"/><stop offset="1" stop-color="#4a3566"/></linearGradient>
    <filter id="pop" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <symbol id="bot" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/>
      <rect x="2" y="18" width="4" height="9" rx="2" fill="currentColor"/><rect x="34" y="18" width="4" height="9" rx="2" fill="currentColor"/>
      <rect x="5" y="10" width="30" height="25" rx="8" fill="currentColor"/>
      <rect x="9" y="15" width="22" height="14" rx="6" fill="#0e1424"/>
      <circle cx="15" cy="22" r="2.6" fill="#7df9ff"/><circle cx="25" cy="22" r="2.6" fill="#7df9ff"/>
    </symbol>
    <symbol id="bot-zz" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="4" r="2.6" fill="currentColor"/>
      <rect x="2" y="18" width="4" height="9" rx="2" fill="currentColor"/><rect x="34" y="18" width="4" height="9" rx="2" fill="currentColor"/>
      <rect x="5" y="10" width="30" height="25" rx="8" fill="currentColor"/>
      <rect x="9" y="15" width="22" height="14" rx="6" fill="#0e1424"/>
      <path d="M12.5 22 q2.5 2 5 0 M22.5 22 q2.5 2 5 0" stroke="#7df9ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
  <rect width="960" height="660" fill="url(#bg)"/>
  <text x="24" y="24" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ACT III · NEWS FROM HIDDEN ROBOTS, AND MOVING THE ISLAND</text>

  <!-- ================= LEFT: the island grows to speak ================= -->
  <g font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">
    <text x="40" y="50">A · WORKING WHILE HIDDEN: a live ticker</text>
    <text x="40" y="176">B · DONE: drops a toast, auto-tucks back after a few seconds</text>
    <text x="40" y="312">C · NEEDS YOU: stays open (and pulses) until you act</text>
    <text x="40" y="448">D · AFTERWARDS: back to rest, a dot marks what you missed</text>
  </g>

  <!-- A -->
  <rect x="40" y="58" width="440" height="90" rx="8" fill="url(#wp)"/>
  <path d="M110,58 H410 V82 A16,16 0 0 1 394,98 H126 A16,16 0 0 1 110,82 Z" fill="#0b0f1a" filter="url(#pop)"/>
  <circle cx="134" cy="77" r="13" fill="#1c2438"/>
  <use href="#bot" x="124" y="67" width="20" height="20" style="color:#60a5fa"/>
  <circle cx="134" cy="77" r="15" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="60 34" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 134 77" to="360 134 77" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="156" y="81" font-size="12" font-weight="700" fill="#fff">SC Culi</text>
  <text x="206" y="81" font-size="11.5" fill="#cbd5e1">Running npm run build</text>
  <text x="394" y="81" font-size="11" fill="#fbbf24" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace">0:42</text>

  <!-- B -->
  <rect x="40" y="184" width="440" height="100" rx="8" fill="url(#wp)"/>
  <path d="M80,184 H440 V232 A22,22 0 0 1 418,254 H102 A22,22 0 0 1 80,232 Z" fill="#0b0f1a" filter="url(#pop)"/>
  <circle cx="112" cy="214" r="16" fill="#1c2438"/>
  <use href="#bot" x="99" y="200" width="26" height="26" style="color:#60a5fa"/>
  <circle cx="125" cy="226" r="6.5" fill="#4ade80" stroke="#0b0f1a" stroke-width="2"/>
  <path d="M122,226 l2,2 l3.5,-4" stroke="#0b0f1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="140" y="210" font-size="12.5" font-weight="700" fill="#fff">SC Culi finished</text>
  <text x="140" y="227" font-size="11" fill="#94a3b8">Build passed · 3 files changed</text>
  <rect x="318" y="202" width="70" height="24" rx="12" fill="#e2e8f0"/>
  <text x="353" y="218" font-size="11.5" font-weight="600" fill="#0b1426" text-anchor="middle">Bring out</text>
  <rect x="394" y="202" width="24" height="24" rx="12" fill="none" stroke="#334155"/>
  <text x="406" y="218" font-size="11" fill="#94a3b8" text-anchor="middle">✕</text>
  <!-- auto-dismiss countdown -->
  <rect x="120" y="244" width="280" height="2.5" rx="1.25" fill="#1c2438"/>
  <rect x="120" y="244" width="170" height="2.5" rx="1.25" fill="#4ade80" opacity="0.8"/>

  <!-- C -->
  <rect x="40" y="320" width="440" height="100" rx="8" fill="url(#wp)"/>
  <path d="M80,320 H440 V368 A22,22 0 0 1 418,390 H102 A22,22 0 0 1 80,368 Z" fill="#0b0f1a" filter="url(#pop)"/>
  <path d="M80,320 H440 V368 A22,22 0 0 1 418,390 H102 A22,22 0 0 1 80,368 Z" fill="none" stroke="#fb7185" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.9;0.15;0.9" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <circle cx="112" cy="350" r="16" fill="#1c2438"/>
  <use href="#bot" x="99" y="336" width="26" height="26" style="color:#34d399"/>
  <circle cx="125" cy="362" r="6.5" fill="#fb7185" stroke="#0b0f1a" stroke-width="2"/>
  <text x="125" y="365.5" font-size="9" font-weight="800" fill="#0b0f1a" text-anchor="middle">?</text>
  <text x="140" y="346" font-size="12.5" font-weight="700" fill="#fff">English Tutor needs you</text>
  <text x="140" y="363" font-size="11" fill="#94a3b8">“Save these 5 new words?”</text>
  <rect x="318" y="338" width="62" height="24" rx="12" fill="#fb7185"/>
  <text x="349" y="354" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Answer</text>
  <rect x="386" y="338" width="44" height="24" rx="12" fill="none" stroke="#334155"/>
  <text x="408" y="354" font-size="11" fill="#94a3b8" text-anchor="middle">Later</text>

  <!-- D -->
  <rect x="40" y="456" width="440" height="80" rx="8" fill="url(#wp)"/>
  <path d="M155,456 H365 V476 A16,16 0 0 1 349,492 H171 A16,16 0 0 1 155,476 Z" fill="#0b0f1a" filter="url(#pop)"/>
  <circle cx="221" cy="474" r="12" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
  <use href="#bot" x="212" y="464" width="18" height="18" style="color:#34d399" opacity="0.5"/>
  <circle cx="199" cy="474" r="12" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
  <use href="#bot" x="190" y="464" width="18" height="18" style="color:#60a5fa" opacity="0.5"/>
  <circle cx="177" cy="474" r="12" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
  <use href="#bot" x="168" y="464" width="18" height="18" style="color:#a78bfa"/>
  <circle cx="207" cy="465" r="4" fill="#4ade80" stroke="#0b0f1a" stroke-width="1.5"/>
  <circle cx="229" cy="465" r="4" fill="#fb7185" stroke="#0b0f1a" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="242" y="478" font-size="11" fill="#cbd5e1">1 out · 2 away</text>
  <text x="346" y="478" font-size="10" fill="#64748b">▾</text>

  <g font-size="11.5" fill="#475569">
    <text x="40" y="562">• One toast at a time; “needs you” jumps the queue.</text>
    <text x="40" y="580">• Robots already out on the desk use their own speech bubble;</text>
    <text x="52" y="596">the island only speaks for the hidden ones.</text>
    <text x="40" y="614">• Hovering a toast pauses its countdown.</text>
  </g>

  <!-- ================= RIGHT: moving it ================= -->
  <g font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.6">
    <text x="520" y="50">E · PRESS &amp; HOLD, DRAG TO ANY EDGE</text>
    <text x="520" y="356">F · ON A SIDE EDGE, THE PANEL SLIDES INWARD</text>
  </g>

  <!-- E: mini screen -->
  <rect x="520" y="58" width="416" height="240" rx="8" fill="url(#wp)"/>
  <!-- ghost spots -->
  <g fill="none" stroke="#e2e8f0" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.55">
    <path d="M690,58 H790 V66 A10,10 0 0 1 780,76 H700 A10,10 0 0 1 690,66 Z"/>
    <path d="M936,140 V230 H928 A10,10 0 0 1 918,220 V150 A10,10 0 0 1 928,140 Z"/>
    <path d="M640,298 H740 V290 A10,10 0 0 0 730,280 H650 A10,10 0 0 0 640,290 Z"/>
  </g>
  <!-- drag trail -->
  <path d="M700,82 C640,100 590,120 562,160" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M562,160 l1,-9 M562,160 l8,-4" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
  <!-- island now on the left edge, vertical -->
  <path d="M520,120 H538 A16,16 0 0 1 554,136 V224 A16,16 0 0 1 538,240 H520 Z" fill="#0b0f1a" filter="url(#pop)"/>
  <circle cx="536" cy="140" r="11" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
  <use href="#bot" x="528" y="131" width="16" height="16" style="color:#a78bfa"/>
  <circle cx="536" cy="162" r="11" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
  <use href="#bot" x="528" y="153" width="16" height="16" style="color:#60a5fa" opacity="0.5"/>
  <circle cx="536" cy="184" r="11" fill="#1c2438" stroke="#0b0f1a" stroke-width="2"/>
  <use href="#bot-zz" x="528" y="175" width="16" height="16" style="color:#34d399" opacity="0.45"/>
  <text x="536" y="212" font-size="10" fill="#cbd5e1" text-anchor="middle">3</text>
  <text x="537" y="230" font-size="9" fill="#64748b" text-anchor="middle">▸</text>
  <!-- held-pointer hint -->
  <circle cx="552" cy="200" r="9" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
  <text x="600" y="210" font-size="11" fill="#e2e8f0">snaps to the nearest edge,</text>
  <text x="600" y="226" font-size="11" fill="#e2e8f0">any spot along it</text>
  <text x="728" y="270" font-size="10" fill="#e2e8f0" opacity="0.7" text-anchor="middle">(dashed = other places it could live)</text>

  <!-- F: side panel -->
  <rect x="520" y="364" width="416" height="240" rx="8" fill="url(#wp)"/>
  <path d="M520,376 H740 A22,22 0 0 1 762,398 V570 A22,22 0 0 1 740,592 H520 Z" fill="#0b0f1a" filter="url(#pop)"/>
  <g>
    <rect x="532" y="390" width="218" height="58" rx="12" fill="#151c2c"/>
    <circle cx="558" cy="419" r="17" fill="#1c2438"/>
    <use href="#bot" x="544" y="405" width="28" height="28" style="color:#a78bfa"/>
    <circle cx="570" cy="431" r="4.5" fill="#4ade80" stroke="#151c2c" stroke-width="1.5"/>
    <text x="584" y="415" font-size="12" font-weight="700" fill="#fff">C-Bot</text>
    <text x="584" y="431" font-size="10.5" fill="#94a3b8">On desk · idle</text>
    <rect x="676" y="408" width="66" height="22" rx="11" fill="none" stroke="#334155"/>
    <text x="709" y="423" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Send away</text>

    <rect x="532" y="454" width="218" height="58" rx="12" fill="#151c2c"/>
    <circle cx="558" cy="483" r="17" fill="#1c2438"/>
    <use href="#bot" x="544" y="469" width="28" height="28" style="color:#60a5fa" opacity="0.55"/>
    <circle cx="558" cy="483" r="18.5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="74 42" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 558 483" to="360 558 483" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="584" y="479" font-size="12" font-weight="700" fill="#fff">SC Culi</text>
    <text x="584" y="495" font-size="10.5" fill="#fbbf24">Building… · 0:42</text>
    <rect x="676" y="472" width="66" height="22" rx="11" fill="#e2e8f0"/>
    <text x="709" y="487" font-size="10.5" font-weight="600" fill="#0b1426" text-anchor="middle">Bring out</text>

    <rect x="532" y="518" width="218" height="58" rx="12" fill="#151c2c"/>
    <circle cx="558" cy="547" r="17" fill="#1c2438"/>
    <use href="#bot-zz" x="544" y="533" width="28" height="28" style="color:#34d399" opacity="0.5"/>
    <text x="584" y="543" font-size="12" font-weight="700" fill="#fff">English Tutor</text>
    <text x="584" y="559" font-size="10.5" fill="#64748b">Asleep · away</text>
    <rect x="676" y="536" width="66" height="22" rx="11" fill="#e2e8f0"/>
    <text x="709" y="551" font-size="10.5" font-weight="600" fill="#0b1426" text-anchor="middle">Bring out</text>
  </g>
  <text x="850" y="470" font-size="11" fill="#e2e8f0" text-anchor="middle">same cards,</text>
  <text x="850" y="486" font-size="11" fill="#e2e8f0" text-anchor="middle">stacked as a column</text>
  <text x="850" y="502" font-size="11" fill="#e2e8f0" text-anchor="middle">so many robots fit</text>
</svg>
