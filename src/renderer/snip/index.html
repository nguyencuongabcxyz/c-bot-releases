<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:" />
  <title>Drag a box round a word</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
    #shot { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #dim { position: fixed; inset: 0; background: rgba(15, 18, 32, 0.45); }
    #box { position: fixed; border: 2px solid #ff8fab; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(15, 18, 32, 0.45); display: none; }
    body.dragging #dim { display: none; }
    body.dragging #box { display: block; }
    #hint {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 16px;
      background: #fffdf5; color: #1d2235; border: 3px solid #1d2235; box-shadow: 0 4px 0 #1d2235;
      font: 600 15px "Segoe UI", system-ui, sans-serif; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <img id="shot" alt="" draggable="false" />
  <div id="dim"></div>
  <div id="box"></div>
  <div id="hint">📚 Drag a box round the word to save it · Esc to cancel</div>
  <script src="snip.js"></script>
</body>
</html>
