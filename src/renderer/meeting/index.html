<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
  <title>Meeting room</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    /* the whole room is where you drag the window from */
    #room { position: absolute; inset: 0; -webkit-app-region: drag; }
    #room canvas { display: block; }
    /* what each robot just said, over its head (cartoon, like the desk's speech bubble) */
    .say {
      position: absolute; left: 0; top: 0; z-index: 2; width: max-content; max-width: 190px;
      background: #fff; color: #1d2235; border: 2.5px solid #1d2235; border-radius: 12px; padding: 3px 8px;
      font: 700 11px/1.25 "Segoe UI", sans-serif; text-align: center; overflow-wrap: anywhere; pointer-events: none;
      opacity: 0; transform: translate(-50%, -100%) scale(0.6); transform-origin: 50% 100%;
      transition: opacity 0.16s, transform 0.22s cubic-bezier(.3,1.6,.5,1);
    }
    .say.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    .say.dots { font-size: 14px; letter-spacing: 2px; padding: 0 9px 3px; }
    .say.ok { background: #d9fbe6; border-color: #12804a; color: #12804a; }
    .say::after {
      content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; background: inherit;
      border-right: 2.5px solid; border-bottom: 2.5px solid; border-color: inherit; transform: translateX(-50%) rotate(45deg);
    }
  </style>
</head>
<body>
  <div id="room"></div>
  <script src="../meeting3d.bundle.js"></script>
  <script src="meeting.js"></script>
</body>
</html>
