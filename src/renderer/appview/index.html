<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data:; frame-src cbot-app:" />
  <title>Tool view</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font: 14px "Segoe UI", system-ui, sans-serif; color: #1d2235; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; color: #eef1ff; } }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #note { position: absolute; inset: 0; display: grid; place-items: center; color: #6b7189; font-style: italic; }
    #note[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- An MCP tool's view, big, in its own window (its fullscreen mode) -->
  <div id="note">Loading…</div>
  <script src="../appHost.js"></script>
  <script src="appview.js"></script>
</body>
</html>
