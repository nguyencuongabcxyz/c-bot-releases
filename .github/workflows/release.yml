# Build the Windows installer and publish it as a GitHub release whenever main gets a
# version (package.json) that hasn't been released yet. Installed copies of C-Bot update
# themselves from these releases (app/src/updater.rs reads the latest.json uploaded
# here). Pushes that don't change the version just check and stop.
#
# One secret to set up (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY: the updater's private key (the public half is in
#   app/tauri.conf.json). Without it the build fails: installed copies only take
#   updates signed with it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # or run it by hand from the Actions tab

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version new?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released: nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new: building and publishing it."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.new == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.new == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'
        with:
          workspaces: app

      - name: Install
        if: steps.version.outputs.new == 'true'
        run: bun install --frozen-lockfile

      - name: Build and publish
        if: steps.version.outputs.new == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tauriScript: bun tauri
          tagName: v__VERSION__
          releaseName: C-Bot v__VERSION__
          releaseBody: |
            Download **C-Bot_${{ steps.version.outputs.version }}_x64-setup.exe** below and run it.

            Coming from C-Bot 0.4.0 or older? That version can't update itself to this one:
            uninstall it (Settings > Apps), then install this. Your robots, chats, words and
            notes are copied over the first time the new one starts.
          releaseDraft: false
          prerelease: false
